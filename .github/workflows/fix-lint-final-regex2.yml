name: Temporary Final Regex Fixer 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix-regex2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply exact regex cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('[-/\\-]', '[-/]'),
              ('[\\/-]', '[-/]'),
          ]
          for old, new in replacements:
              print('replace', repr(old), 'count=', s.count(old))
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify lint and build before commit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/modules/VehicleExcelImportModal.jsx .github/workflows/fix-lint-final-regex2.yml
          git rm .github/workflows/fix-lint-final-regex2.yml
          git commit -m "[lint-fix-regex2] clear remaining vehicle regex lint error"
          git push origin HEAD:main
