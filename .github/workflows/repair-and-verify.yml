name: Repair and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Repair known source blockers
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          import re

          changes = []

          p = Path('frontend/src/modules/DocumentsFeaturePage.jsx')
          text = p.read_text(encoding='utf-8')
          old = "try{event.currentTarget.setPointerCapture?.(event.pointerId)}catch { /* intentional no-op */ }"
          new = "event.currentTarget.setPointerCapture?.(event.pointerId)"
          if old in text:
              p.write_text(text.replace(old, new), encoding='utf-8')
              changes.append(str(p))

          p = Path('frontend/src/modules/EditableServiceExcelImportModal.jsx')
          text = p.read_text(encoding='utf-8')
          text2 = re.sub(r"\nconst EDITABLE_KEYS = new Set\(\['source_no', \.\.\.Object\.keys\(ALIASES\)\]\)\n", "\n", text, count=1)
          if text2 != text:
              p.write_text(text2, encoding='utf-8')
              changes.append(str(p))

          p = Path('frontend/src/modules/MasterKendaraanPage.jsx')
          text = p.read_text(encoding='utf-8')
          text2 = re.sub(r"\bconst current = detail;\s*", "", text, count=1)
          text2 = re.sub(r"try\{event\.currentTarget\.setPointerCapture\?\.\(event\.pointerId\)\}catch\s*\{\s*\}\s*", "event.currentTarget.setPointerCapture?.(event.pointerId)", text2, count=1)
          if text2 != text:
              p.write_text(text2, encoding='utf-8')
              changes.append(str(p))

          p = Path('frontend/src/modules/VehicleExcelImportModalV2.jsx')
          text = p.read_text(encoding='utf-8')
          marker = "const activeRows = filterDeletedExcelRows('kendaraan', workbook.valid)"
          text2 = text.replace(marker, '')
          text2 = text2.replace('activeRows', "filterDeletedExcelRows('kendaraan', workbook.valid)")
          if text2 != text:
              p.write_text(text2, encoding='utf-8')
              changes.append(str(p))

          print('Patched:', ', '.join(dict.fromkeys(changes)) if changes else 'no source changes needed')

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit repaired sources
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/DocumentsFeaturePage.jsx frontend/src/modules/EditableServiceExcelImportModal.jsx frontend/src/modules/MasterKendaraanPage.jsx frontend/src/modules/VehicleExcelImportModalV2.jsx
          git commit -m 'fix: clear remaining frontend lint blockers'
          git push
