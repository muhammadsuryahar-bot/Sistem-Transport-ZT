name: Repair and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Align Excel source fields
        working-directory: .
        run: python scripts/align_excel_sources.py

      - name: Normalize generated Excel source syntax
        working-directory: .
        run: python scripts/fix_excel_alignment_lint.py

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit aligned sources
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/align_excel_sources.py scripts/fix_excel_alignment_lint.py frontend/src/utils/excelSourceMeta.js frontend/src/modules/PengajuanExcelImportModal.jsx frontend/src/modules/PermintaanServicePageFixed.jsx frontend/src/modules/EditableServiceExcelImportModal.jsx frontend/src/modules/ServiceFeaturePage.jsx frontend/src/modules/VehicleDocumentsImportModal.jsx frontend/src/modules/DocumentsFeaturePage.jsx frontend/src/modules/RentalHistoryImportModalV2.jsx frontend/src/modules/RentalFeaturePage.jsx frontend/src/AppTransport.jsx
          git commit -m 'fix: preserve exact Excel source fields across transport history'
          git push
