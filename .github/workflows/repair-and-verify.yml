name: Repair and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Repair known source blockers and Excel alignment
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          import re

          changes = []

          # Existing known lint/source repairs.
          p = Path('frontend/src/modules/DocumentsFeaturePage.jsx')
          text = p.read_text(encoding='utf-8')
          old = "try{event.currentTarget.setPointerCapture?.(event.pointerId)}catch { /* intentional no-op */ }"
          new = "event.currentTarget.setPointerCapture?.(event.pointerId)"
          if old in text:
              p.write_text(text.replace(old, new), encoding='utf-8')
              changes.append(str(p))

          p = Path('frontend/src/modules/EditableServiceExcelImportModal.jsx')
          text = p.read_text(encoding='utf-8')
          text2 = re.sub(r"\nconst EDITABLE_KEYS = new Set\(\['source_no', \.\.\.Object\.keys\(ALIASES\)\]\)\n", "\n", text, count=1)
          if text2 != text:
              p.write_text(text2, encoding='utf-8')
              changes.append(str(p))

          p = Path('frontend/src/modules/MasterKendaraanPage.jsx')
          text = p.read_text(encoding='utf-8')
          text2 = re.sub(r"\bconst current = detail;\s*", "", text, count=1)
          text2 = re.sub(r"try\{event\.currentTarget\.setPointerCapture\?\.\(event\.pointerId\)\}catch\s*\{\s*\}\s*", "event.currentTarget.setPointerCapture?.(event.pointerId)", text2, count=1)
          if text2 != text:
              p.write_text(text2, encoding='utf-8')
              changes.append(str(p))

          p = Path('frontend/src/modules/VehicleExcelImportModalV2.jsx')
          text = p.read_text(encoding='utf-8')
          marker = "const activeRows = filterDeletedExcelRows('kendaraan', workbook.valid)"
          text2 = text.replace(marker, '')
          text2 = text2.replace('activeRows', "filterDeletedExcelRows('kendaraan', workbook.valid)")
          if text2 != text:
              p.write_text(text2, encoding='utf-8')
              changes.append(str(p))

          # Rental history aligned to SUMMERY RENTAL.
          p = Path('frontend/src/modules/RentalFeaturePage.jsx')
          text = p.read_text(encoding='utf-8')
          if "const historicalRows = useMemo" not in text:
              anchor = "  const repairMap = useMemo(() => Object.fromEntries(repairs.map(r => [r.id, r])), [repairs])\n"
              insert = anchor + "  const historicalRows = useMemo(() => {\n    const contractMap = Object.fromEntries(contracts.map(c => [c.id, c]))\n    const ownerMap = Object.fromEntries(owners.map(o => [o.id, o]))\n    return payments.map((payment, index) => {\n      const contract = contractMap[payment.kontrak_sewa_id]\n      const owner = ownerMap[contract?.pemilik_sewa_id]\n      const date = payment.bulan_pembayaran ? new Date(`${payment.bulan_pembayaran}T00:00:00`) : null\n      const note = payment.catatan || ''\n      const imported = note.match(/^Import SUMMERY RENTAL (\\d{4}) • ([^•]+) • ([^•]+) • (.*)$/)\n      const monthName = date && !Number.isNaN(date.getTime()) ? new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(date) : '-'\n      return {\n        no_excel: index + 1,\n        tahun: imported?.[1] || (date && !Number.isNaN(date.getTime()) ? date.getFullYear() : '-'),\n        supplier: imported?.[3]?.trim() || owner?.nama_pemilik || owner?.nama_perusahaan || '-',\n        uraian: imported?.[4]?.trim() || note || '-',\n        periode_tagihan: imported?.[2]?.trim() || monthName,\n        nilai_invoice: payment.jumlah_tagihan,\n      }\n    })\n  }, [payments, contracts, owners])\n"
              text = text.replace(anchor, insert, 1)
              changes.append(str(p))
          tab_anchor = "<div className=\"x-tabs\">{[['kontrak', 'Kontrak'], ['pemilik', 'Pemilik'], ['pembayaran', 'Pembayaran'], ['repair', 'Perbaikan']].map(([v, l]) => <button key={v} className={tab === v ? 'active' : ''} onClick={() => { clearMessages(); setTab(v) }}>{l}</button>)}</div>"
          tab_new = "<div className=\"x-tabs\">{[['kontrak', 'Kontrak'], ['pemilik', 'Pemilik'], ['pembayaran', 'Pembayaran'], ['historis', 'Riwayat Excel'], ['repair', 'Perbaikan']].map(([v, l]) => <button key={v} className={tab === v ? 'active' : ''} onClick={() => { clearMessages(); setTab(v) }}>{l}</button>)}</div>"
          if tab_anchor in text:
              text = text.replace(tab_anchor, tab_new, 1)
              changes.append(str(p))
          if "{tab === 'historis' &&" not in text:
              marker = "\n    {tab === 'repair' && <section className=\"x-card\">"
              section = "\n    {tab === 'historis' && <section className=\"x-card\">\n      <div className=\"x-card-title\"><div><h3>Riwayat Rental — Format SUMMERY RENTAL</h3><p>Kolom mengikuti Excel: No, Tahun, Supplier, Uraian, Periode Tagihan, Nilai Invoice.</p></div></div>\n      <div className=\"x-table-wrap\"><table className=\"x-table\"><thead><tr><th>No</th><th>Tahun</th><th>Supplier</th><th>Uraian</th><th>Periode Tagihan</th><th>Nilai Invoice</th></tr></thead><tbody>{historicalRows.length ? historicalRows.map(row => <tr key={`${row.no_excel}-${row.tahun}-${row.periode_tagihan}-${row.supplier}`}><td>{row.no_excel}</td><td>{row.tahun}</td><td>{row.supplier}</td><td>{row.uraian}</td><td>{row.periode_tagihan}</td><td>{money(row.nilai_invoice)}</td></tr>) : <tr><td colSpan=\"6\"><Empty /></td></tr>}</tbody></table></div>\n    </section>}"
              if marker in text:
                  text = text.replace(marker, section + marker, 1)
                  changes.append(str(p))
          p.write_text(text, encoding='utf-8')

          # Service page: add an Excel-aligned Data Service view beside the operational workflow.
          p = Path('frontend/src/modules/ServiceFeaturePage.jsx')
          text = p.read_text(encoding='utf-8')
          if "serviceExcelRows" not in text:
              text = text.replace("const [tab, setTab] = useState('pekerjaan')", "const [tab, setTab] = useState('excel')")
              text = text.replace("const [loading, setLoading] = useState(true), [saving, setSaving] = useState(false), [error, setError] = useState(''), [success, setSuccess] = useState('')", "const [loading, setLoading] = useState(true), [saving, setSaving] = useState(false), [error, setError] = useState(''), [success, setSuccess] = useState('')\n  const [drivers, setDrivers] = useState([])")
              old_query = "supabase.from('kendaraan').select('id,nomor_polisi,merk,tipe,kilometer_terakhir,status').order('nomor_polisi'),"
              new_query = "supabase.from('kendaraan').select('id,nomor_polisi,merk,tipe,jenis_kendaraan,tahun,driver_id,kilometer_terakhir,status').order('nomor_polisi'),"
              text = text.replace(old_query, new_query, 1)
              old_parallel = "supabase.from('riwayat_kilometer').select('*').order('tanggal', { ascending: false })])"
              new_parallel = "supabase.from('riwayat_kilometer').select('*').order('tanggal', { ascending: false }), supabase.from('driver').select('id,nama_lengkap').order('nama_lengkap')])"
              text = text.replace(old_parallel, new_parallel, 1)
              text = text.replace("const names = ['Kendaraan', 'Pengajuan', 'Service', 'Item', 'Bukti', 'Approval', 'Ban', 'Aki', 'KM']", "const names = ['Kendaraan', 'Pengajuan', 'Service', 'Item', 'Bukti', 'Approval', 'Ban', 'Aki', 'KM', 'Driver']", 1)
              text = text.replace("setKms(rs[8].data || []); setLoading(false)", "setKms(rs[8].data || []); setDrivers(rs[9].data || []); setLoading(false)", 1)
              anchor = "  const pending = requests.filter(r => ['MENUNGGU_TRANSPORT', 'DITERIMA_TRANSPORT', 'DALAM_PROSES'].includes(r.status))\n"
              insert = anchor + "  const driverMap = useMemo(() => Object.fromEntries(drivers.map(d => [d.id, d])), [drivers])\n  const serviceMap = useMemo(() => Object.fromEntries(services.map(s => [s.id, s])), [services])\n  const serviceExcelRows = useMemo(() => {\n    const rows = []\n    if (items.length) items.forEach((item, index) => {\n      const s = serviceMap[item.service_id]; const v = vehicleMap[s?.kendaraan_id]\n      const date = s?.tanggal_service ? new Date(`${s.tanggal_service}T00:00:00`) : null\n      rows.push({ no: index + 1, merk: v?.merk || '-', type: v?.tipe || '-', jenis: v?.jenis_kendaraan || '-', tahun: v?.tahun || '-', nomor_polisi: v?.nomor_polisi || '-', driver: driverMap[v?.driver_id]?.nama_lengkap || '-', bulan: date && !Number.isNaN(date.getTime()) ? new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(date) : '-', tanggal: s?.tanggal_service || '-', jenis_pekerjaan: TYPES[s?.jenis_service] || s?.jenis_service || '-', uraian: item.nama_item || s?.keluhan || '-', qty: item.jumlah ?? '-', satuan: item.satuan || '-', harga_satuan: item.harga_satuan ?? '-', nilai_dpp: item.subtotal ?? '-', ppn: '-', total: item.subtotal ?? '-', kilometer: s?.kilometer ?? '-', bengkel: s?.bengkel || '-', keterangan: item.keterangan || s?.catatan || '-' })\n    })\n    if (!rows.length) services.forEach((s, index) => { const v = vehicleMap[s.kendaraan_id]; const date = s.tanggal_service ? new Date(`${s.tanggal_service}T00:00:00`) : null; rows.push({ no: index + 1, merk: v?.merk || '-', type: v?.tipe || '-', jenis: v?.jenis_kendaraan || '-', tahun: v?.tahun || '-', nomor_polisi: v?.nomor_polisi || '-', driver: driverMap[v?.driver_id]?.nama_lengkap || '-', bulan: date && !Number.isNaN(date.getTime()) ? new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(date) : '-', tanggal: s.tanggal_service || '-', jenis_pekerjaan: TYPES[s.jenis_service] || s.jenis_service || '-', uraian: s.keluhan || '-', qty: '-', satuan: '-', harga_satuan: '-', nilai_dpp: s.nilai_dpp ?? '-', ppn: s.ppn ?? '-', total: s.total ?? s.biaya_aktual ?? '-', kilometer: s.kilometer ?? '-', bengkel: s.bengkel || '-', keterangan: s.catatan || '-' }) })\n    return rows\n  }, [items, services, serviceMap, vehicleMap, driverMap])\n"
              text = text.replace(anchor, insert, 1)
              tabs_old = "const tabs = [['pekerjaan', 'Pekerjaan'], ['item', 'Item Service'], ['bukti', 'Bukti'], ['ban', 'Riwayat Ban'], ['aki', 'Riwayat Aki'], ['km', 'Riwayat KM']]"
              tabs_new = "const tabs = [['excel', 'Riwayat Excel'], ['pekerjaan', 'Pekerjaan'], ['item', 'Item Service'], ['bukti', 'Bukti'], ['ban', 'Riwayat Ban'], ['aki', 'Riwayat Aki'], ['km', 'Riwayat KM']]"
              text = text.replace(tabs_old, tabs_new, 1)
              excel_marker = "{tab === 'pekerjaan' && <><section className=\"x-card\">"
              excel_section = "{tab === 'excel' && <section className=\"x-card\"><div className=\"x-card-title\"><div><h3>Riwayat Service — Format Data Service Excel</h3><p>Kolom mengikuti sheet Data Service: No, Merk, Type, Jenis, Tahun, No. Polisi, Driver/PIC, Bulan, Tanggal, Jenis Pekerjan, Uraian, Qty, Sat, Harga Satuan, Nilai DPP, PPn, Total, KM, Nama Bengkel, Keterangan.</p></div></div><div className=\"x-table-wrap\"><table className=\"x-table\"><thead><tr><th>No</th><th>Merk</th><th>Type</th><th>Jenis</th><th>Tahun</th><th>No. Polisi</th><th>Driver/PIC</th><th>Bulan</th><th>Tanggal</th><th>Jenis Pekerjan</th><th>Uraian</th><th>Qty</th><th>Sat</th><th>Harga Satuan (Rp)</th><th>Nilai DPP</th><th>PPn</th><th>Total</th><th>KM</th><th>Nama Bengkel</th><th>Keterangan</th></tr></thead><tbody>{serviceExcelRows.length ? serviceExcelRows.map(row => <tr key={`${row.no}-${row.nomor_polisi}-${row.tanggal}-${row.uraian}`}><td>{row.no}</td><td>{row.merk}</td><td>{row.type}</td><td>{row.jenis}</td><td>{row.tahun}</td><td>{row.nomor_polisi}</td><td>{row.driver}</td><td>{row.bulan}</td><td>{row.tanggal}</td><td>{row.jenis_pekerjaan}</td><td>{row.uraian}</td><td>{row.qty}</td><td>{row.satuan}</td><td>{money(row.harga_satuan)}</td><td>{money(row.nilai_dpp)}</td><td>{row.ppn === '-' ? '-' : money(row.ppn)}</td><td>{money(row.total)}</td><td>{row.kilometer}</td><td>{row.bengkel}</td><td>{row.keterangan}</td></tr>) : <tr><td colSpan=\"20\"><Empty text=\"Belum ada riwayat service.\" /></td></tr>}</tbody></table></div></section>}"
              if excel_marker in text: text = text.replace(excel_marker, excel_section + excel_marker, 1)
              changes.append(str(p))
          p.write_text(text, encoding='utf-8')

          # Pengajuan page: expose the exact Rekapan Permintaan columns as the default view while keeping operational detail controls.
          p = Path('frontend/src/modules/PermintaanServicePageFixed.jsx')
          text = p.read_text(encoding='utf-8')
          if "requestExcelRows" not in text:
              text = text.replace("const [vehicles, setVehicles] = useState([])", "const [vehicles, setVehicles] = useState([])\n  const [services, setServices] = useState([])")
              text = text.replace("const [selectionMode, setSelectionMode] = useState(false)", "const [selectionMode, setSelectionMode] = useState(false)\n  const [viewMode, setViewMode] = useState('excel')")
              old_load = "supabase.from('permintaan_service').select('*').order('created_at', { ascending: false }),"
              new_load = old_load + "\n      supabase.from('service').select('permintaan_service_id,biaya_aktual,estimasi_biaya,total').order('created_at', { ascending: false }),"
              text = text.replace(old_load, new_load, 1)
              text = text.replace("if (r.error) setError(current => current || `Data pengajuan: ${r.error.message}`); else setRequests(r.data || [])", "if (r.error) setError(current => current || `Data pengajuan: ${r.error.message}`); else setRequests(r.data || [])\n    setServices(rs?.[2]?.data || [])", 1)
              # Replace destructuring load to keep third response available.
              text = text.replace("const [v, r] = await Promise.all([", "const rs = await Promise.all([", 1)
              text = text.replace("if (v.error) setError(`Data kendaraan: ${v.error.message}`); else setVehicles(v.data || [])\n    if (r.error) setError(current => current || `Data pengajuan: ${r.error.message}`); else setRequests(r.data || [])\n    setServices(rs?.[2]?.data || [])", "if (rs[0].error) setError(`Data kendaraan: ${rs[0].error.message}`); else setVehicles(rs[0].data || [])\n    if (rs[1].error) setError(current => current || `Data pengajuan: ${rs[1].error.message}`); else setRequests(rs[1].data || [])\n    if (rs[2].error) setError(current => current || `Data service: ${rs[2].error.message}`); else setServices(rs[2].data || [])", 1)
              anchor = "  const vehicleMap = useMemo(() => Object.fromEntries(vehicles.map(v => [v.id, v])), [vehicles])\n"
              insert = anchor + "  const serviceCostMap = useMemo(() => Object.fromEntries(services.map(s => [s.permintaan_service_id, s.total ?? s.biaya_aktual ?? s.estimasi_biaya ?? null])), [services])\n  const requestExcelRows = useMemo(() => filtered.map((r, index) => { const v = vehicleMap[r.kendaraan_id]; return { no: index + 1, homebase: v?.lokasi || '-', unit_kendaraan: v?.unit_kerja || '-', nomor_polisi: v?.nomor_polisi || '-', merk: v?.merk || '-', type: v?.tipe || '-', tanggal: r.tanggal_pengajuan || '-', biaya: serviceCostMap[r.id], keterangan: r.keluhan || '-' } }), [filtered, vehicleMap, serviceCostMap])\n"
              text = text.replace(anchor, insert, 1)
              # Add view toggle before selection bar.
              toggle_anchor = "      <div className=\"request-toolbar\"><input"
              toggle_new = "      <div className=\"request-toolbar\"><div className=\"request-view-toggle\"><button className=\"request-light-button\" onClick={() => setViewMode('excel')}>Riwayat Excel</button><button className=\"request-light-button\" onClick={() => setViewMode('operasional')}>Operasional</button></div><input"
              text = text.replace(toggle_anchor, toggle_new, 1)
              # Replace the request table expression with a mode branch.
              table_start = "      <div className=\"request-table-wrap\">"
              if table_start in text and "viewMode === 'excel'" not in text:
                  old_block = "      <div className=\"request-table-wrap\">{loading?<div className=\"request-empty\">Memuat pengajuan...</div>:filtered.length===0?<div className=\"request-empty\"><strong>Belum ada pengajuan yang cocok.</strong><span>{canCreate?'Buat pengajuan pertama dari tombol di atas.':'Data akan muncul ketika pengajuan tersedia.'}</span></div>:<table className={`request-table ${selectionMode?'request-selection-active':''}`}><thead><tr>{selectionMode&&<th className=\"request-select-cell\"><input type=\"checkbox\" aria-label=\"Pilih semua pengajuan\" checked={allSelected} onChange={toggleAll}/></th>}<th>Pengajuan</th><th>Kendaraan</th><th>Kebutuhan</th><th>KM</th><th>Prioritas</th><th>Status</th><th>Aksi</th></tr></thead><tbody>{filtered.map(r=>{const v=vehicleMap[r.kendaraan_id];const selected=selectedIds.includes(r.id);return <tr key={r.id} className={selected?'request-selected':''} onPointerDown={e=>armLongPress(e,r.id)} onPointerMove={moveLongPress} onPointerUp={finishLongPress} onPointerCancel={finishLongPress} onClick={e=>{if(isInteractiveTarget(e.target))return;if(ignoreClickRef.current){ignoreClickRef.current=false;return}if(selectionMode)toggle(r.id)}}>{selectionMode&&<td className=\"request-select-cell\"><input type=\"checkbox\" aria-label={`Pilih pengajuan ${r.nomor_pengajuan||r.id}`} checked={selected} onChange={()=>toggle(r.id)}/></td>}<td><div className=\"request-main-cell\"><strong>{r.nomor_pengajuan||`#${r.id}`}</strong><span>{fmtDate(r.tanggal_pengajuan)}</span></div></td><td><div className=\"request-main-cell\"><strong>{v?.nomor_polisi||'-'}</strong><span>{v?`${v.merk}${v.tipe?` • ${v.tipe}`:''}`:'Data kendaraan tidak ditemukan'}</span></div></td><td><div className=\"request-main-cell\"><strong>{TYPE_LABELS[r.jenis_permintaan]||r.jenis_permintaan}</strong><span>{r.keluhan}</span></div></td><td><strong>{fmtNum(r.kilometer_pengajuan)} km</strong></td><td><span className={`request-priority priority-${String(r.prioritas||'NORMAL').toLowerCase()}`}>{r.prioritas==='MENDESAK'?'Mendesak':'Normal'}</span></td><td><span className={`request-status status-${String(r.status||'').toLowerCase()}`}>{STATUS_LABELS[r.status]||r.status}</span></td><td><button className=\"request-detail-button\" onClick={()=>setDetail(r)}>Detail</button>{canDelete&&<button className=\"request-detail-button danger\" onClick={()=>{if(window.confirm(`Hapus pengajuan ${r.nomor_pengajuan||r.id}?`))deleteOne(r).then(ok=>ok&&loadData())}} disabled={saving}>Hapus</button>}</td></tr>})}</tbody></table>}</div>"
                  new_block = "      <div className=\"request-table-wrap\">{loading?<div className=\"request-empty\">Memuat pengajuan...</div>:filtered.length===0?<div className=\"request-empty\"><strong>Belum ada pengajuan yang cocok.</strong><span>{canCreate?'Buat pengajuan pertama dari tombol di atas.':'Data akan muncul ketika pengajuan tersedia.'}</span></div>:viewMode==='excel'?<table className=\"request-table\"><thead><tr><th>No</th><th>Homebase</th><th>Unit Kendaraan</th><th>No Polisi</th><th>Merk</th><th>Type</th><th>Tanggal</th><th>Biaya (Rp)</th><th>Keterangan</th></tr></thead><tbody>{requestExcelRows.map(row=><tr key={`${row.no}-${row.nomor_polisi}-${row.tanggal}`}><td>{row.no}</td><td>{row.homebase}</td><td>{row.unit_kendaraan}</td><td>{row.nomor_polisi}</td><td>{row.merk}</td><td>{row.type}</td><td>{row.tanggal}</td><td>{row.biaya == null ? '-' : fmtNum(row.biaya)}</td><td>{row.keterangan}</td></tr>)}</tbody></table>:<table className={`request-table ${selectionMode?'request-selection-active':''}`}><thead><tr>{selectionMode&&<th className=\"request-select-cell\"><input type=\"checkbox\" aria-label=\"Pilih semua pengajuan\" checked={allSelected} onChange={toggleAll}/></th>}<th>Pengajuan</th><th>Kendaraan</th><th>Kebutuhan</th><th>KM</th><th>Prioritas</th><th>Status</th><th>Aksi</th></tr></thead><tbody>{filtered.map(r=>{const v=vehicleMap[r.kendaraan_id];const selected=selectedIds.includes(r.id);return <tr key={r.id} className={selected?'request-selected':''} onPointerDown={e=>armLongPress(e,r.id)} onPointerMove={moveLongPress} onPointerUp={finishLongPress} onPointerCancel={finishLongPress} onClick={e=>{if(isInteractiveTarget(e.target))return;if(ignoreClickRef.current){ignoreClickRef.current=false;return}if(selectionMode)toggle(r.id)}}>{selectionMode&&<td className=\"request-select-cell\"><input type=\"checkbox\" aria-label={`Pilih pengajuan ${r.nomor_pengajuan||r.id}`} checked={selected} onChange={()=>toggle(r.id)}/></td>}<td><div className=\"request-main-cell\"><strong>{r.nomor_pengajuan||`#${r.id}`}</strong><span>{fmtDate(r.tanggal_pengajuan)}</span></div></td><td><div className=\"request-main-cell\"><strong>{v?.nomor_polisi||'-'}</strong><span>{v?`${v.merk}${v.tipe?` • ${v.tipe}`:''}`:'Data kendaraan tidak ditemukan'}</span></div></td><td><div className=\"request-main-cell\"><strong>{TYPE_LABELS[r.jenis_permintaan]||r.jenis_permintaan}</strong><span>{r.keluhan}</span></div></td><td><strong>{fmtNum(r.kilometer_pengajuan)} km</strong></td><td><span className={`request-priority priority-${String(r.prioritas||'NORMAL').toLowerCase()}`}>{r.prioritas==='MENDESAK'?'Mendesak':'Normal'}</span></td><td><span className={`request-status status-${String(r.status||'').toLowerCase()}`}>{STATUS_LABELS[r.status]||r.status}</span></td><td><button className=\"request-detail-button\" onClick={()=>setDetail(r)}>Detail</button>{canDelete&&<button className=\"request-detail-button danger\" onClick={()=>{if(window.confirm(`Hapus pengajuan ${r.nomor_pengajuan||r.id}?`))deleteOne(r).then(ok=>ok&&loadData())}} disabled={saving}>Hapus</button>}</td></tr>})}</tbody></table>}</div>"
                  if old_block in text: text = text.replace(old_block, new_block, 1)
              changes.append(str(p))
          p.write_text(text, encoding='utf-8')

          # Documents page: make STNK/KIR Excel monitoring the default view and keep the detailed document manager as a second view.
          p = Path('frontend/src/modules/DocumentsFeaturePage.jsx')
          text = p.read_text(encoding='utf-8')
          if "monitorRows" not in text:
              text = text.replace("const [loading,setLoading]=useState(true),[saving,setSaving]=useState(false),[error,setError]=useState(''),[success,setSuccess]=useState('')", "const [loading,setLoading]=useState(true),[saving,setSaving]=useState(false),[error,setError]=useState(''),[success,setSuccess]=useState('')\n const [viewMode,setViewMode]=useState('excel')")
              text = text.replace("supabase.from('kendaraan').select('id,nomor_polisi,merk,tipe').order('nomor_polisi')", "supabase.from('kendaraan').select('id,nomor_polisi,merk,tipe,tahun,nomor_rangka,pemilik').order('nomor_polisi')", 1)
              anchor = " const filtered=useMemo(()=>{const q=query.trim().toLowerCase();return docs.filter(d=>{const days=d.tanggal_jatuh_tempo?Math.ceil((new Date(d.tanggal_jatuh_tempo)-new Date())/86400000):null;const status=days===null?'TANPA_TANGGAL':days<0?'EXPIRED':days<=30?'SEGERA':'AMAN';const text=[d.jenis_dokumen,d.nomor_dokumen,d.keterangan,vehicleMap[d.kendaraan_id]?.nomor_polisi,vehicleMap[d.kendaraan_id]?.merk].filter(Boolean).join(' ').toLowerCase();return (!q||text.includes(q))&&(statusFilter==='SEMUA'||status===statusFilter)})},[docs,vehicleMap,query,statusFilter])\n"
              insert = anchor + " const monitorRows=useMemo(()=>vehicles.map((v,index)=>{const byType={};docs.filter(d=>d.kendaraan_id===v.id).forEach(d=>{byType[d.jenis_dokumen]=d});return{no:index+1,merk:v.merk||'-',tipe:v.tipe||'-',nomor_polisi:v.nomor_polisi||'-',tahun:v.tahun||'-',nomor_rangka:v.nomor_rangka||'-',stnk:byType.STNK?.tanggal_jatuh_tempo||'-',kir:byType.KIR?.tanggal_jatuh_tempo||'-',lima_tahun:byType['5_TAHUNAN']?.tanggal_jatuh_tempo||'-',pemilik:v.pemilik||'-'}}),[vehicles,docs])\n"
              text = text.replace(anchor, insert, 1)
              view_anchor = "  {canManage&&<section className=\"x-card\">"
              view_new = "  <div className=\"x-tabs\"><button className={viewMode==='excel'?'active':''} onClick={()=>setViewMode('excel')}>Monitoring Excel</button><button className={viewMode==='detail'?'active':''} onClick={()=>setViewMode('detail')}>Detail Dokumen</button></div>{viewMode==='detail'&&<section className=\"x-card\">"
              text = text.replace(view_anchor, view_new, 1)
              # Close the existing manage section by changing its adjacent list marker to remain inside detail mode.
              list_marker = "  <section className=\"x-card\"><div className=\"x-card-title\"><div><h3>Daftar Dokumen</h3>"
              text = text.replace(list_marker, "  <section className=\"x-card\"><div className=\"x-card-title\"><div><h3>Daftar Dokumen</h3>", 1)
              # Add exact monitoring section before the detailed list card and close the conditional after the detailed list.
              monitor_section = "  {viewMode==='excel'&&<section className=\"x-card\"><div className=\"x-card-title\"><div><h3>Monitoring STNK DAN KIR</h3><p>Kolom mengikuti Excel: NO, MERK, TYPE, NO.POLISI, TAHUN, No Ranka, STNK, KIR, 5 TAHUN, PEMILIK.</p></div></div><div className=\"x-table-wrap\"><table className=\"x-table\"><thead><tr><th>NO</th><th>MERK</th><th>TYPE</th><th>NO.POLISI</th><th>TAHUN</th><th>No Ranka</th><th>STNK</th><th>KIR</th><th>5 TAHUN</th><th>PEMILIK</th></tr></thead><tbody>{monitorRows.map(row=><tr key={`${row.no}-${row.nomor_polisi}`}><td>{row.no}</td><td>{row.merk}</td><td>{row.tipe}</td><td>{row.nomor_polisi}</td><td>{row.tahun}</td><td>{row.nomor_rangka}</td><td>{fmt(row.stnk)}</td><td>{fmt(row.kir)}</td><td>{fmt(row.lima_tahun)}</td><td>{row.pemilik}</td></tr>)}</tbody></table></div></section>}\n"
              detailed_anchor = "  <section className=\"x-card\"><div className=\"x-card-title\"><div><h3>Daftar Dokumen</h3>"
              if detailed_anchor in text: text = text.replace(detailed_anchor, monitor_section + detailed_anchor, 1)
              text = text.replace(" </section>\n </div>\n}", " </section>}\n </div>\n}", 1)
              changes.append(str(p))
          p.write_text(text, encoding='utf-8')

          # Exact Excel-aligned export sheets for Pengajuan and Service.
          p = Path('frontend/src/AppTransport.jsx')
          text = p.read_text(encoding='utf-8')
          # Pengajuan: add vehicle operational location/unit and service cost lookup without changing existing export.
          text = text.replace("supabase.from('kendaraan').select('id,nomor_polisi,merk,tipe').order('nomor_polisi'),", "supabase.from('kendaraan').select('id,nomor_polisi,merk,tipe,lokasi,unit_kerja').order('nomor_polisi'),", 1)
          old_req = "        const vehicleMap = Object.fromEntries((vehicles || []).map(x => [x.id, x]))\n        exportToExcel(`Rekap-Pengajuan-Service-ZT-${stamp}.xls`, [{ title: 'PENGAJUAN SERVICE', columns: columns([['nomor_pengajuan','Nomor Pengajuan'],['tanggal_pengajuan','Tanggal Pengajuan'],['pemohon_id','ID Pemohon'],['kendaraan','Nomor Polisi'],['kendaraan_detail','Merk / Tipe'],['kilometer_pengajuan','KM Pengajuan'],['jenis_permintaan','Jenis Permintaan'],['keluhan','Keluhan'],['prioritas','Prioritas'],['status','Status'],['catatan_transport','Catatan Transport'],['diproses_oleh','Diproses Oleh'],['diproses_at','Diproses At']]), rows: cleanRows(requests || []).map(x => ({ ...x, kendaraan: vehicleMap[x.kendaraan_id]?.nomor_polisi || '-', kendaraan_detail: vehicleMap[x.kendaraan_id] ? `${vehicleMap[x.kendaraan_id].merk || ''}${vehicleMap[x.kendaraan_id].tipe ? ` • ${vehicleMap[x.kendaraan_id].tipe}` : ''}` : '-' })) }])"
          new_req = "        const vehicleMap = Object.fromEntries((vehicles || []).map(x => [x.id, x]))\n        const requestIds = (requests || []).map(x => x.id)\n        const { data: requestServices, error: requestServiceError } = requestIds.length ? await supabase.from('service').select('permintaan_service_id,biaya_aktual,estimasi_biaya,total').in('permintaan_service_id', requestIds) : { data: [], error: null }\n        if (requestServiceError) throw requestServiceError\n        const requestCostMap = Object.fromEntries((requestServices || []).map(s => [s.permintaan_service_id, s.total ?? s.biaya_aktual ?? s.estimasi_biaya ?? null]))\n        const sourceRequestRows = (requests || []).map((x, index) => ({ no: index + 1, homebase: vehicleMap[x.kendaraan_id]?.lokasi || '-', unit_kendaraan: vehicleMap[x.kendaraan_id]?.unit_kerja || '-', nomor_polisi: vehicleMap[x.kendaraan_id]?.nomor_polisi || '-', merk: vehicleMap[x.kendaraan_id]?.merk || '-', type: vehicleMap[x.kendaraan_id]?.tipe || '-', tanggal: x.tanggal_pengajuan || '-', biaya: requestCostMap[x.id], keterangan: x.keluhan || '-' }))\n        exportToExcel(`Rekap-Pengajuan-Service-ZT-${stamp}.xls`, [{ title: 'REKAPAN PERMINTAAN', columns: columns([['no','No'],['homebase','Homebase'],['unit_kendaraan','Unit Kendaraan'],['nomor_polisi','No Polisi'],['merk','Merk'],['type','Type'],['tanggal','Tanggal'],['biaya','Biaya (Rp)'],['keterangan','Keterangan']]), rows: sourceRequestRows }, { title: 'PENGAJUAN SERVICE', columns: columns([['nomor_pengajuan','Nomor Pengajuan'],['tanggal_pengajuan','Tanggal Pengajuan'],['pemohon_id','ID Pemohon'],['kendaraan','Nomor Polisi'],['kendaraan_detail','Merk / Tipe'],['kilometer_pengajuan','KM Pengajuan'],['jenis_permintaan','Jenis Permintaan'],['keluhan','Keluhan'],['prioritas','Prioritas'],['status','Status'],['catatan_transport','Catatan Transport'],['diproses_oleh','Diproses Oleh'],['diproses_at','Diproses At']]), rows: cleanRows(requests || []).map(x => ({ ...x, kendaraan: vehicleMap[x.kendaraan_id]?.nomor_polisi || '-', kendaraan_detail: vehicleMap[x.kendaraan_id] ? `${vehicleMap[x.kendaraan_id].merk || ''}${vehicleMap[x.kendaraan_id].tipe ? ` • ${vehicleMap[x.kendaraan_id].tipe}` : ''}` : '-' })) }])"
          if old_req in text: text = text.replace(old_req, new_req, 1); changes.append(str(p))

          # Service: expand vehicle query and add driver query at the end; preserve all old indexes 0..8.
          text = text.replace("supabase.from('kendaraan').select('id,nomor_polisi'),", "supabase.from('kendaraan').select('id,nomor_polisi,merk,tipe,jenis_kendaraan,tahun,driver_id'),", 1)
          service_rs_anchor = "          supabase.from('permintaan_service').select('id,nomor_pengajuan').order('created_at', { ascending: false }),\n        ])"
          service_rs_new = "          supabase.from('permintaan_service').select('id,nomor_pengajuan').order('created_at', { ascending: false }),\n          supabase.from('driver').select('id,nama_lengkap').order('nama_lengkap'),\n        ])"
          if service_rs_anchor in text:
              text = text.replace(service_rs_anchor, service_rs_new, 1); changes.append(str(p))
          service_names_old = "        const names = ['service','item','approval','bukti','ban','aki','kilometer','kendaraan','pengajuan']"
          service_names_new = "        const names = ['service','item','approval','bukti','ban','aki','kilometer','kendaraan','pengajuan','driver']"
          text = text.replace(service_names_old, service_names_new, 1)
          service_export_anchor = "        const requestMap = Object.fromEntries((rs[8].data || []).map(x => [x.id, x]))\n        exportToExcel(`Rekap-Service-ZT-${stamp}.xls`, ["
          service_export_new = "        const requestMap = Object.fromEntries((rs[8].data || []).map(x => [x.id, x]))\n        const driverMapExport = Object.fromEntries((rs[9].data || []).map(x => [x.id, x]))\n        const sourceServiceRows = []\n        ;(rs[1].data || []).forEach((item, index) => { const s = (rs[0].data || []).find(row => row.id === item.service_id); const v = vehicleMap[s?.kendaraan_id]; sourceServiceRows.push({ no: index + 1, merk: v?.merk || '-', type: v?.tipe || '-', jenis: v?.jenis_kendaraan || '-', tahun: v?.tahun || '-', nomor_polisi: v?.nomor_polisi || '-', driver: driverMapExport[v?.driver_id]?.nama_lengkap || '-', bulan: s?.tanggal_service ? new Intl.DateTimeFormat('id-ID', { month: 'long' }).format(new Date(s.tanggal_service)) : '-', tanggal: s?.tanggal_service || '-', jenis_pekerjaan: s ? (s.jenis_service || '-') : '-', uraian: item.nama_item || '-', qty: item.jumlah ?? '-', satuan: item.satuan || '-', harga_satuan: item.harga_satuan ?? '-', nilai_dpp: item.subtotal ?? '-', ppn: '-', total: item.subtotal ?? '-', kilometer: s?.kilometer ?? '-', bengkel: s?.bengkel || '-', keterangan: item.keterangan || s?.catatan || '-' }) })\n        exportToExcel(`Rekap-Service-ZT-${stamp}.xls`, [\n          { title: 'DATA SERVICE', columns: columns([['no','No'],['merk','Merk'],['type','Type'],['jenis','Jenis'],['tahun','Tahun'],['nomor_polisi','No. Polisi'],['driver','Driver/PIC'],['bulan','Bulan'],['tanggal','Tanggal'],['jenis_pekerjaan','Jenis Pekerjan'],['uraian','Uraian'],['qty','Qty'],['satuan','Sat'],['harga_satuan','Harga Satuan (Rp)'],['nilai_dpp','Nilai DPP'],['ppn','PPn'],['total','Total'],['kilometer','KM'],['bengkel','Nama Bengkel'],['keterangan','Keterangan']]), rows: sourceServiceRows },"
          if service_export_anchor in text: text = text.replace(service_export_anchor, service_export_new, 1); changes.append(str(p))
          p.write_text(text, encoding='utf-8')

          print('Patched:', ', '.join(dict.fromkeys(changes)) if changes else 'no source changes needed')

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit repaired sources
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/DocumentsFeaturePage.jsx frontend/src/modules/EditableServiceExcelImportModal.jsx frontend/src/modules/MasterKendaraanPage.jsx frontend/src/modules/VehicleExcelImportModalV2.jsx frontend/src/modules/RentalFeaturePage.jsx frontend/src/modules/ServiceFeaturePage.jsx frontend/src/modules/PermintaanServicePageFixed.jsx frontend/src/AppTransport.jsx
          git commit -m 'fix: align service and request views with source Excel'
          git push

      # Final verification must run against the latest main commit.
