name: Temporary Remaining Lint Fixer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix-2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix remaining Vehicle importer regex lint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text(encoding='utf-8')
          old = '[\\/-]'
          count = s.count(old)
          if count < 1:
              raise SystemExit('Expected remaining regex escape was not found.')
          p.write_text(s.replace(old, '[-/]'), encoding='utf-8')
          PY
      - name: Verify lint before commit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/modules/VehicleExcelImportModal.jsx .github/workflows/fix-lint-remaining.yml
          git rm .github/workflows/fix-lint-remaining.yml
          git commit -m "[lint-fix-2] clear remaining Vehicle importer lint errors"
          git push origin HEAD:main
