name: Vehicle Rules Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[vehicle-rules-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch final business rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new, required=True):
              text = load(path)
              if old not in text:
                  if required:
                      raise SystemExit(f'Missing expected text in {path}: {old[:180]!r}')
                  return False
              save(path, text.replace(old, new, 1))
              return True

          # 1) Vehicle Excel import: keep Aset/Sewa exactly aligned with Excel.
          path = 'frontend/src/modules/VehicleExcelImportModalV2.jsx'
          text = load(path)
          text = text.replace(
              "      const activeRows = filterDeletedExcelRows('kendaraan', workbook.valid)\n      const sheets = await parseXlsx(nextFile)",
              "      const sheets = await parseXlsx(nextFile)",
          )
          text = text.replace(
              "  const start = async () => {\n    if (!workbook || !canImport || saving) return\n",
              "  const start = async () => {\n    if (!workbook || !canImport || saving) return\n    const activeRows = filterDeletedExcelRows('kendaraan', workbook.valid)\n",
          )
          text = text.replace(
              "if (['ASET', 'MILIK', 'MILIK KANTOR', 'ASET KANTOR'].includes(ownership)) out.kepemilikan = 'ASET_KANTOR'",
              "if (['ASET', 'MILIK', 'MILIK KANTOR', 'ASET KANTOR'].includes(ownership)) out.kepemilikan = 'ASET'",
          )
          text = text.replace(
              "else if (!ownership) out.kepemilikan = 'ASET_KANTOR'",
              "else if (!ownership) out.kepemilikan = 'ASET'",
          )
          save(path, text)

          # 2) Vehicle master: never silently convert an unknown owner-status to Sewa.
          path = 'frontend/src/modules/MasterKendaraanExcelAlignedPage.jsx'
          text = load(path)
          text = text.replace(
              "const normalizeOwnership = value => {\n  const v = clean(value).toUpperCase().replace(/\\s+/g, '_')\n  if (v === 'ASET_KANTOR' || v === 'ASET') return 'ASET'\n  return 'SEWA'\n}",
              "const normalizeOwnership = value => {\n  const v = clean(value).toUpperCase().replace(/\\s+/g, '_')\n  if (v === 'ASET_KANTOR' || v === 'ASET') return 'ASET'\n  if (v === 'SEWA') return 'SEWA'\n  return ''\n}",
          )

          # Owner must be chosen from the Excel-derived owner values already in the master data.
          owner_pattern = re.compile(r'<input(?=[^>]*name="pemilik")(?=[^>]*list="mep-owner-options")[^>]*/>')
          owner_repl = '<select name="pemilik" value={form.pemilik} onChange={change}><option value="">— Pilih pemilik —</option>{ownerOptions.map(owner => <option key={owner} value={owner}>{owner}</option>)}</select>'
          text, owner_count = owner_pattern.subn(owner_repl, text, count=1)
          if owner_count == 0:
              raise SystemExit('Owner selector input was not found; refusing an unsafe partial patch.')

          # Driver must be selected by name, not by exposing raw numeric IDs.
          driver_pattern = re.compile(r'<input(?=[^>]*name="driver_id")(?=[^>]*list="mep-driver-options")[^>]*/>')
          driver_repl = '<select name="driver_id" value={form.driver_id} onChange={change}><option value="">— Pilih driver —</option>{drivers.map(driver => <option key={driver.id} value={driver.id}>{driver.nama_lengkap}{driver.status ? ` • ${driver.status}` : ""}</option>)}</select>'
          text, driver_count = driver_pattern.subn(driver_repl, text, count=1)
          if driver_count == 0:
              raise SystemExit('Driver selector input was not found; refusing an unsafe partial patch.')

          # Enforce the two allowed ownership values at save time.
          text = text.replace(
              "if (!clean(form.nomor_polisi) || !clean(form.merk) || !clean(form.jenis_kendaraan)) throw new Error('Nomor polisi, merk, dan jenis kendaraan wajib diisi.')",
              "if (!clean(form.nomor_polisi) || !clean(form.merk) || !clean(form.jenis_kendaraan)) throw new Error('Nomor polisi, merk, dan jenis kendaraan wajib diisi.')\n      if (!['ASET', 'SEWA'].includes(form.kepemilikan)) throw new Error('Kepemilikan harus Aset atau Sewa.')",
          )

          # Limit photo uploads to real images and a practical size cap.
          text = text.replace(
              "const uploadPhoto = async (vehicleId, side, file) => {\n    if (!file) return null\n    const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_')",
              "const uploadPhoto = async (vehicleId, side, file) => {\n    if (!file) return null\n    if (!file.type.startsWith('image/')) throw new Error(`Foto ${side} harus berupa file gambar.`)\n    if (file.size > 5 * 1024 * 1024) throw new Error(`Foto ${side} maksimal 5 MB.`)\n    const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_')",
          )
          save(path, text)

          # 3) Export Kendaraan: exactly mirror the Excel source columns, without legacy KM/status/rental fields.
          path = 'frontend/src/AppTransport.jsx'
          text = load(path)
          export_pattern = re.compile(
              r"\{ title: 'KENDARAAN', columns: columns\(\[\[.*?\]\]\), rows: cleanRows\(v\.data \|\| \[\]\)\.map\(x => \(\{ \.\.\.x, driver: driverMap\[x\.driver_id\]\?\.nama_lengkap \|\| '-' \}\)\) \},",
              re.S,
          )
          export_repl = "{ title: 'KENDARAAN', columns: columns([['no_export','No'],['nomor_polisi','No. Pol'],['merk','Merk'],['tipe','Type'],['jenis_kendaraan','Jenis'],['tahun','Tahun'],['nomor_mesin','No. Mesin'],['nomor_rangka','No. Rangka'],['pemilik','Pemilik'],['kepemilikan','Status'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak'],['unit_kerja','Unit Kerja'],['driver','Driver'],['lokasi','Lokasi Kerja'],['keterangan','Keterangan'],['catatan_hutang','Catatan Hutang']]), rows: cleanRows(v.data || []).map((x, index) => ({ ...x, no_export: index + 1, kepemilikan: x.kepemilikan === 'ASET_KANTOR' ? 'Aset' : x.kepemilikan === 'ASET' ? 'Aset' : 'Sewa', driver: driverMap[x.driver_id]?.nama_lengkap || '-' })) },"
          text, export_count = export_pattern.subn(export_repl, text, count=1)
          if export_count == 0:
              raise SystemExit('Kendaraan export block was not found; refusing an unsafe partial patch.')
          save(path, text)

          # 4) Existing lint blockers: clear only known blocking patterns, idempotently.
          replacements = {
              'frontend/src/modules/DataPageTools.jsx': [
                  ('function writeRowMarks(value) { try { localStorage.setItem(ROW_MARK_STORAGE, JSON.stringify(value)) } catch {} }',
                   'function writeRowMarks(value) { try { localStorage.setItem(ROW_MARK_STORAGE, JSON.stringify(value)); return true } catch { return false } }')
              ],
              'frontend/src/modules/DocumentsFeaturePage.jsx': [
                  ("[editing,setEditing]=useState(null),[query,setQuery]=useState(''),[statusFilter,setStatusFilter]=useState('SEMUA'),[selectedDocIds,setSelectedDocIds]=useState([])",
                   "[editing,setEditing]=useState(null),[query]=useState(''),[statusFilter]=useState('SEMUA'),[selectedDocIds,setSelectedDocIds]=useState([])")
              ],
              'frontend/src/modules/EditableServiceExcelImportModal.jsx': [
                  ("const EDITABLE_KEYS = new Set(['source_no', ...Object.keys(ALIASES)])\n", '')
              ],
              'frontend/src/modules/MasterKendaraanPage.jsx': [
                  ('const current = detail; setDetail(null); openVehicle(current)', 'setDetail(null); openVehicle(detail)')
              ],
          }
          for p, pairs in replacements.items():
              t = load(p)
              for old, new in pairs:
                  t = t.replace(old, new)
              t = re.sub(r'catch \{\}', 'catch { /* intentional no-op for optional browser storage state */ }', t)
              save(p, t)

          for p in ['frontend/src/modules/PermintaanServicePageFixed.jsx', 'frontend/src/utils/excelPreviewControls.js']:
              t = load(p)
              t = re.sub(r'catch \{\}', 'catch { /* intentional no-op for optional browser storage state */ }', t)
              save(p, t)
          PY

      - name: Verify lint
        working-directory: frontend
        run: npm ci && npm run lint

      - name: Verify production build
        working-directory: frontend
        run: npm run build

      - name: Commit verified sync
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required after verification."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src .github/workflows/vehicle-rules-sync.yml
          git commit -m "fix: finalize vehicle Excel alignment [vehicle-rules-sync]"
          git push origin HEAD:main
