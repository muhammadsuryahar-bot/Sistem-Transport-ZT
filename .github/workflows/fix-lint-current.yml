name: Temporary Current Lint Fixer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix-current]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect and repair exact parser/unused errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          lines = p.read_text(encoding='utf-8').splitlines()
          for i in range(110, 121):
              if i <= len(lines):
                  print(f'{i}: {lines[i-1]}')
          s = '\n'.join(lines)
          # Restore only malformed slash-regex forms that make the JS parser fail.
          s = s.replace("replace(/^//, '')", "replace(/^\\//, '')")
          # The current importer should only have a valid leading-slash regex.
          s = re.sub(r"replace\(/\^//,\s*''\)", "replace(/^\\//, '')", s)
          p.write_text(s + '\n', encoding='utf-8')

          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('const [exportingPage, setExportingPage] = useState(false)', 'const [, setExportingPage] = useState(false)', 1)
          if s2 == s:
              print('AppTransport exportingPage already fixed or absent.')
          else:
              p.write_text(s2, encoding='utf-8')
          PY
      - name: Show changed snippets
        shell: bash
        run: |
          nl -ba frontend/src/modules/VehicleExcelImportModal.jsx | sed -n '108,120p'
          grep -n "exportingPage" frontend/src/AppTransport.jsx || true
      - name: Verify lint and build before commit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fixes and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/AppTransport.jsx frontend/src/modules/VehicleExcelImportModal.jsx .github/workflows/fix-lint-current.yml
          git rm .github/workflows/fix-lint-current.yml
          git commit -m "[lint-fix-current] repair verified frontend lint issues"
          git push origin HEAD:main
