name: Temporary Final Lint Fixer 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix-final2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply exact remaining lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('[-/\\-]', '[-/]'),
              ('[\\/-]', '[-/]'),
              ('v.split(/[\\/-]/)', 'v.split(/[-/]/)'),
          ]:
              print('replace', repr(old), s.count(old))
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text(encoding='utf-8')
          old = 'const [exportingPage, setExportingPage] = useState(false)'
          new = 'const [, setExportingPage] = useState(false)'
          print('exportingPage declaration', s.count(old))
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify lint and build before commit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/AppTransport.jsx frontend/src/modules/VehicleExcelImportModal.jsx .github/workflows/fix-lint-final2.yml
          git rm .github/workflows/fix-lint-final2.yml
          git commit -m "[lint-fix-final2] clear remaining frontend lint errors"
          git push origin HEAD:main
