name: Finalize vehicle Excel mapping
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: "${{ !contains(github.event.head_commit.message, '[vehicle-excel-final]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact workbook fields and automatic sheet selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          assert "const EXACT_SHEETS" in s and "kendaraan: ['data kendaraan']" in s
          assert 'dpt-sheet-list' not in s
          target = "      lokasi: valueOf(row, headers, 'lokasi') || null,\n      kilometer_terakhir: current?.kilometer_terakhir ?? 0,"
          if "masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak'))" not in s:
              assert target in s
              s = s.replace(target, "      lokasi: valueOf(row, headers, 'lokasi') || null,\n      masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak')),\n      kilometer_terakhir: current?.kilometer_terakhir ?? 0,", 1)
          p.write_text(s)

          p = Path('frontend/src/modules/MasterKendaraanPage.jsx')
          m = p.read_text()
          if "masa_berlaku_pajak: ''" not in m:
              anchor = "  kode_kendaraan: '', nomor_polisi: '', merk: '', tipe: '', jenis_kendaraan: '', tahun: '', warna: '', nomor_rangka: '', nomor_mesin: '',\n"
              assert anchor in m
              m = m.replace(anchor, anchor + "  masa_berlaku_pajak: '', status_pajak: '', unit_kerja: '', catatan_hutang: '',\n", 1)
          if 'nomor_mesin,masa_berlaku_pajak,status_pajak' not in m:
              assert 'nomor_mesin,status_pajak' in m
              m = m.replace('nomor_mesin,status_pajak', 'nomor_mesin,masa_berlaku_pajak,status_pajak', 1)
          if 'masa_berlaku_pajak: vehicleForm.masa_berlaku_pajak' not in m:
              assert 'lokasi: vehicleForm.lokasi.trim() || null, status_pajak:' in m
              m = m.replace('lokasi: vehicleForm.lokasi.trim() || null, status_pajak:', 'lokasi: vehicleForm.lokasi.trim() || null, masa_berlaku_pajak: vehicleForm.masa_berlaku_pajak || null, status_pajak:', 1)
          if "['masa_berlaku_pajak','Masa Berlaku Pajak']" not in m:
              assert "['nomor_mesin','Nomor Mesin'],['status_pajak'" in m
              m = m.replace("['nomor_mesin','Nomor Mesin'],['status_pajak'", "['nomor_mesin','Nomor Mesin'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak'", 1)
          p.write_text(m)

          p = Path('frontend/src/AppTransport.jsx')
          a = p.read_text()
          vehicle_section_start = a.find("{ title: 'KENDARAAN'")
          driver_section_start = a.find("{ title: 'DRIVER / PIC'")
          assert vehicle_section_start >= 0 and driver_section_start > vehicle_section_start
          vehicle_section = a[vehicle_section_start:driver_section_start]
          if "['masa_berlaku_pajak','Masa Berlaku Pajak']" not in vehicle_section:
              token = "['nomor_rangka','Nomor Rangka'],['nomor_mesin','Nomor Mesin']"
              assert token in vehicle_section
              a = a.replace(token, token + ",['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak'],['unit_kerja','Unit Kerja'],['catatan_hutang','Catatan Hutang']", 1)
          p.write_text(a)

          mig = Path('supabase/migrations/20260909130000_vehicle_excel_master_columns.sql')
          mig.write_text('''-- Exact operational columns from Data Kendaraan 07 Mei 2026.\nALTER TABLE public.kendaraan\n  ADD COLUMN IF NOT EXISTS masa_berlaku_pajak date,\n  ADD COLUMN IF NOT EXISTS status_pajak text,\n  ADD COLUMN IF NOT EXISTS unit_kerja text,\n  ADD COLUMN IF NOT EXISTS catatan_hutang text;\n\nCREATE INDEX IF NOT EXISTS idx_kendaraan_masa_berlaku_pajak ON public.kendaraan(masa_berlaku_pajak);\nCREATE INDEX IF NOT EXISTS idx_kendaraan_unit_kerja ON public.kendaraan(unit_kerja);\n''')

          workflows = Path('.github/workflows')
          for name in ['apply-final-vehicle-import.yml','apply-vehicle-import-fix.yml','fix-import-modal.yml','fix-import-ux.yml','patch-vehicle-source-fields.yml','vehicle-excel-fix.yml','verify-vehicle-excel.yml']:
              (workflows / name).unlink(missing_ok=True)

          tools = Path('frontend/src/modules/DataPageTools.jsx').read_text()
          master = Path('frontend/src/modules/MasterKendaraanPage.jsx').read_text()
          app = Path('frontend/src/AppTransport.jsx').read_text()
          checks = {
              'exact vehicle sheet': "kendaraan: ['data kendaraan']" in tools,
              'no sheet picker': 'dpt-sheet-list' not in tools,
              'No. Pol alias': "'no_pol'" in tools,
              'tax due mapping': "masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak'))" in tools,
              'tax status mapping': "status_pajak: valueOf(row, headers, 'status_pajak')" in tools,
              'unit work mapping': "unit_kerja: valueOf(row, headers, 'unit_kerja')" in tools,
              'debt note mapping': "catatan_hutang: valueOf(row, headers, 'catatan_hutang')" in tools,
              'master tax field': 'masa_berlaku_pajak' in master,
              'export tax field': "['masa_berlaku_pajak','Masa Berlaku Pajak']" in app,
              'migration': mig.exists(),
          }
          bad = [k for k, v in checks.items() if not v]
          if bad: raise SystemExit('Source checks failed: ' + ', '.join(bad))
          print('SOURCE CHECKS PASSED', checks)
          PY
          git diff --check
      - name: Lint pass 1
        working-directory: frontend
        run: npm ci && npm run lint
      - name: Build pass 1
        working-directory: frontend
        run: npm run build
      - name: Lint pass 2
        working-directory: frontend
        run: npm run lint
      - name: Build pass 2
        working-directory: frontend
        run: npm run build
      - name: Final file assertions
        shell: bash
        run: |
          git diff --check
          test -f supabase/migrations/20260909130000_vehicle_excel_master_columns.sql
          grep -q "kendaraan: \['data kendaraan'\]" frontend/src/modules/DataPageTools.jsx
          ! grep -q "dpt-sheet-list" frontend/src/modules/DataPageTools.jsx
          grep -q "masa_berlaku_pajak" frontend/src/modules/DataPageTools.jsx
          grep -q "masa_berlaku_pajak" frontend/src/modules/MasterKendaraanPage.jsx
          grep -q "status_pajak" frontend/src/modules/MasterKendaraanPage.jsx
          grep -q "unit_kerja" frontend/src/modules/MasterKendaraanPage.jsx
          grep -q "catatan_hutang" frontend/src/modules/MasterKendaraanPage.jsx
      - name: Commit only after all tests pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: exact vehicle Excel mapping [vehicle-excel-final]'
          git push origin main
