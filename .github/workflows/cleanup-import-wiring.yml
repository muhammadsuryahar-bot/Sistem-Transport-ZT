name: Cleanup import wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor == 'muhammadsuryahar-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix lint issue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/AppTransport.jsx')
          s=p.read_text()
          s=s.replace("  const canExportCurrentPage = ['kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen'].includes(activePage)\n","")
          p.write_text(s)
          PY
          rm -f .github/workflows/cleanup-import-wiring.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/AppTransport.jsx .github/workflows/cleanup-import-wiring.yml
          git commit -m "chore: remove unused page export variable" || exit 0
          git push origin main