name: One-time import transparency fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'muhammadsuryahar-bot' && !contains(github.event.head_commit.message, '[import-transparency-auto]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch import transparency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text()
          s = s.replace("if (nextFile.size > 10 * 1024 * 1024) return setError('Ukuran file maksimal 10 MB.')", "if (nextFile.size > 25 * 1024 * 1024) return setError('Ukuran file maksimal 25 MB.')")
          s = s.replace(": 'Maksimal 10 MB'", ": 'Maksimal 25 MB'")
          s = s.replace(
            "setMessage(`Sheet ${chosen.name} terbaca: ${valid.length} baris kendaraan valid, ${groups.size} kendaraan unik, ${valid.length - groups.size} baris duplikat.`)",
            "setMessage(`Pemeriksaan awal selesai: ${data.length} baris sumber • ${valid.length} baris valid • ${groups.size} kendaraan unik • ${valid.length - groups.size} baris duplikat yang akan digabung.`)"
          )
          s = s.replace(
            "<div className=\"vehicle-import-stats\"><div><b>{selected.data.length}</b><span>baris sumber</span></div><div><b>{selected.uniqueCount}</b><span>kendaraan unik</span></div><div><b>{selected.duplicateCount}</b><span>duplikat digabung</span></div><div><b>{selected.missingSourceNumbers.length}</b><span>nomor urut hilang</span></div></div>",
            "<div className=\"vehicle-import-stats\"><div><b>{selected.data.length}</b><span>baris sumber</span></div><div><b>{selected.valid.length}</b><span>baris valid</span></div><div><b>{selected.uniqueCount}</b><span>kendaraan unik</span></div><div><b>{selected.duplicateCount}</b><span>duplikat digabung</span></div></div>"
          )
          old = "<div className=\"vehicle-import-note\"><b>Penyesuaian yang dilakukan:</b><span>Status = Aset/Sewa → Kepemilikan.</span><span>Masa Berlaku Pajak hanya diterima bila benar-benar tanggal.</span><span>Baris yang kolomnya bergeser diperbaiki berdasarkan pola data.</span><span>Duplikat No. Pol digabung tanpa membuat kendaraan ganda.</span><span>Data STNK tidak dibuat otomatis dari import Kendaraan.</span></div>"
          new = "<div className=\"vehicle-import-explanation\"><b>Kenapa jumlah kendaraan bisa lebih sedikit?</b><span>Excel menghitung baris sumber, sedangkan Master Kendaraan menghitung No. Polisi unik.</span><span>Contoh file ini: 83 baris kendaraan valid → 73 No. Polisi unik → 10 baris duplikat digabung.</span><span>Jadi apabila setelah import terlihat 73 kendaraan, itu bukan 10 kendaraan hilang.</span></div><div className=\"vehicle-import-note\"><b>Penyesuaian yang dilakukan:</b><span>Status = Aset/Sewa → Kepemilikan.</span><span>Masa Berlaku Pajak hanya diterima bila benar-benar tanggal.</span><span>Baris yang kolomnya bergeser diperbaiki berdasarkan pola data.</span><span>Duplikat No. Pol digabung tanpa membuat kendaraan ganda.</span><span>Informasi Keterangan/Catatan Hutang dari baris duplikat digabung, bukan dibuang.</span><span>Data STNK tidak dibuat otomatis dari import Kendaraan.</span></div>"
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          s = s.replace(
            "const finishImport = () => {\n    setShowImport(false)\n    window.setTimeout(() => window.location.reload(), 500)\n  }",
            "const finishImport = () => {\n    setShowImport(false)\n    window.setTimeout(() => window.location.reload(), 4000)\n  }"
          )
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/VehicleExcelImportModal.jsx frontend/src/modules/DataPageTools.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix import transparency [import-transparency-auto]'
          git push
