name: Verify vehicle Excel fix
on:
  push:
    branches:
      - fix/vehicle-excel-exact-mapping
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor == 'muhammadsuryahar-bot' && !contains(github.event.head_commit.message, '[vehicle-excel-final]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch exact workbook mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          required_aliases = {
              "masa_berlaku_pajak": "  masa_berlaku_pajak: ['masa_berlaku_pajak', 'masa_pajak', 'masa_berlaku_pajak_'],",
              "status_pajak": "  status_pajak: ['status_pajak'],",
              "unit_kerja": "  unit_kerja: ['unit_kerja', 'unit_kerja_', 'pengunaan_unit', 'penggunaan_unit'],",
              "catatan_hutang": "  catatan_hutang: ['catatan_hutang', 'catatan_hutang_'],",
          }
          alias_anchor = "  kilometer: ['km', 'kilometer', 'kilometer_pengajuan', 'km_terakhir'],\n"
          for key, line in required_aliases.items():
              if f"  {key}:" not in s:
                  s = s.replace(alias_anchor, alias_anchor + line + "\n", 1)

          if "const EXACT_SHEETS" not in s:
              raise SystemExit('EXACT_SHEETS block missing; refusing to patch unknown import architecture.')
          if "const EXACT_SHEETS = {" not in s or "kendaraan: ['data kendaraan']" not in s:
              raise SystemExit('Vehicle exact sheet mapping is not present.')

          old_tax_block = "      const taxDue = excelDate(valueOf(row, headers, 'masa_berlaku_pajak'))\n      const taxStatus = valueOf(row, headers, 'status_pajak')\n"
          if old_tax_block not in s:
              raise SystemExit('Vehicle tax mapping anchor missing.')
          new_tax_block = old_tax_block
          # Ensure vehicle master itself receives the tax due date; document history is preserved too.
          target = "      lokasi: valueOf(row, headers, 'lokasi') || null,\n      kilometer_terakhir: current?.kilometer_terakhir ?? 0,"
          replacement = "      lokasi: valueOf(row, headers, 'lokasi') || null,\n      masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak')),\n      kilometer_terakhir: current?.kilometer_terakhir ?? 0,"
          if "masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak'))" not in s:
              if target not in s:
                  raise SystemExit('Vehicle payload anchor missing.')
              s = s.replace(target, replacement, 1)

          p.write_text(s)

          p = Path('frontend/src/modules/MasterKendaraanPage.jsx')
          s = p.read_text()
          if "masa_berlaku_pajak: ''" not in s:
              s = s.replace("  status_pajak: '', unit_kerja: '', catatan_hutang: '',", "  masa_berlaku_pajak: '', status_pajak: '', unit_kerja: '', catatan_hutang: '',", 1)
          if 'masa_berlaku_pajak' not in s[s.find('supabase.from(\'kendaraan\').select('):s.find('supabase.from(\'kendaraan\').select(')+700]:
              s = s.replace('nomor_mesin,status_pajak', 'nomor_mesin,masa_berlaku_pajak,status_pajak', 1)
          if 'masa_berlaku_pajak: vehicleForm.masa_berlaku_pajak' not in s:
              s = s.replace('lokasi: vehicleForm.lokasi.trim() || null, status_pajak:', 'lokasi: vehicleForm.lokasi.trim() || null, masa_berlaku_pajak: vehicleForm.masa_berlaku_pajak || null, status_pajak:', 1)
          if "['masa_berlaku_pajak','Masa Berlaku Pajak']" not in s:
              s = s.replace("['nomor_mesin','Nomor Mesin'],['status_pajak'", "['nomor_mesin','Nomor Mesin'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak'", 1)
          p.write_text(s)

          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text()
          token = "['nomor_rangka','Nomor Rangka'],['nomor_mesin','Nomor Mesin'],['status_pajak','Status Pajak']"
          repl = "['nomor_rangka','Nomor Rangka'],['nomor_mesin','Nomor Mesin'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak']"
          if token in s and 'masa_berlaku_pajak' not in s[s.find("{ title: 'KENDARAAN'"):s.find("{ title: 'DRIVER / PIC'")]:
              s = s.replace(token, repl, 1)
          p.write_text(s)

          mig = Path('supabase/migrations/20260909120000_vehicle_source_columns.sql')
          mig.write_text('''ALTER TABLE public.kendaraan\n  ADD COLUMN IF NOT EXISTS masa_berlaku_pajak date,\n  ADD COLUMN IF NOT EXISTS status_pajak text,\n  ADD COLUMN IF NOT EXISTS unit_kerja text,\n  ADD COLUMN IF NOT EXISTS catatan_hutang text;\n\nCREATE INDEX IF NOT EXISTS idx_kendaraan_unit_kerja ON public.kendaraan(unit_kerja);\nCREATE INDEX IF NOT EXISTS idx_kendaraan_masa_pajak ON public.kendaraan(masa_berlaku_pajak);\n''')

          # Remove older failed temporary workflow from the final branch state.
          Path('.github/workflows/verify-vehicle-excel.yml').unlink(missing_ok=True)

          # Strong source assertions before tests.
          checks = [
              ("kendaraan: ['data kendaraan']", 'exact vehicle sheet'),
              ("masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak'))", 'vehicle tax due mapping'),
              ("status_pajak: valueOf(row, headers, 'status_pajak')", 'vehicle tax status mapping'),
              ("unit_kerja: valueOf(row, headers, 'unit_kerja')", 'vehicle unit mapping'),
              ("catatan_hutang: valueOf(row, headers, 'catatan_hutang')", 'vehicle debt note mapping'),
          ]
          for needle, label in checks:
              if needle not in Path('frontend/src/modules/DataPageTools.jsx').read_text():
                  raise SystemExit(f'Missing {label}')
          print('Source assertions passed.')
          PY
      - name: Lint pass 1
        working-directory: frontend
        run: npm ci && npm run lint
      - name: Build pass 1
        working-directory: frontend
        run: npm run build
      - name: Lint pass 2
        working-directory: frontend
        run: npm run lint
      - name: Build pass 2
        working-directory: frontend
        run: npm run build
      - name: Commit only after all verification passes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/DataPageTools.jsx frontend/src/modules/MasterKendaraanPage.jsx frontend/src/AppTransport.jsx supabase/migrations/20260909120000_vehicle_source_columns.sql .github/workflows/vehicle-excel-fix.yml .github/workflows/verify-vehicle-excel.yml
          git commit -m 'fix: exact vehicle Excel mapping [vehicle-excel-final]'
          git push origin HEAD:fix/vehicle-excel-exact-mapping
