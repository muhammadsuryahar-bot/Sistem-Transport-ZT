name: Apply Excel preview controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: "!contains(github.event.head_commit.message, '[excel-preview-controls]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Patch Excel preview controls
        env:
          REPO_FILE: frontend/src/modules/DataPageTools.jsx
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          repo = root / 'frontend' / 'src'

          helper = repo / 'utils' / 'excelPreviewControls.js'
          if not helper.exists():
              helper.write_text("""const STORAGE_KEY = 'transport_excel_preview_deleted_v1'\n\nfunction readStore() {\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY)\n    const value = raw ? JSON.parse(raw) : {}\n    return value && typeof value === 'object' ? value : {}\n  } catch { return {} }\n}\n\nfunction writeStore(value) {\n  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)) } catch {}\n}\n\nexport function rowDeleteKey(context, excelRow) { return `${context}:${String(excelRow)}` }\nexport function getDeletedExcelRows(context) {\n  const store = readStore()\n  return new Set(Array.isArray(store?.[context]) ? store[context].map(String) : [])\n}\nexport function clearDeletedExcelRows(context) {\n  const store = readStore(); delete store[context]; writeStore(store)\n}\nexport function filterDeletedExcelRows(context, rows) {\n  const deleted = getDeletedExcelRows(context)\n  return (rows || []).filter(row => !deleted.has(String(row.excelRow)))\n}\nexport function setDeletedExcelRows(context, rows) {\n  const store = readStore()\n  store[context] = [...new Set((rows || []).map(String))]\n  writeStore(store)\n}\n""", encoding='utf-8')

          dpt = repo / 'modules' / 'DataPageTools.jsx'
          text = dpt.read_text(encoding='utf-8')
          if "excelPreviewControls.js" not in text:
              text = text.replace("import './DataPageTools.css'", "import './DataPageTools.css'\nimport { getDeletedExcelRows, setDeletedExcelRows } from '../utils/excelPreviewControls.js'")

          marker = 'function ensureRowMarks(context) {'
          if 'function ensureExcelPreviewSelection(context)' not in text:
              fn = r'''function ensureExcelPreviewSelection(context) {
  document.querySelectorAll('.dpt-preview table').forEach(table => {
    const preview = table.closest('.dpt-preview')
    if (!preview) return
    const tbody = table.querySelector('tbody')
    const head = table.querySelector('thead tr')
    if (!tbody || !head) return

    const deleted = getDeletedExcelRows(context)
    tbody.querySelectorAll('tr').forEach(row => {
      if (!row.dataset.excelRow) {
        const candidate = row.querySelector('td:first-child')?.querySelector('input')?.value || row.querySelector('td:first-child')?.textContent?.trim() || ''
        if (/^\d+$/.test(String(candidate))) row.dataset.excelRow = String(candidate)
      }
      if (row.dataset.excelRow && deleted.has(String(row.dataset.excelRow))) {
        row.style.display = 'none'
        row.dataset.excelDeleted = '1'
      }
    })

    if (!head.querySelector('.dpt-preview-select-head')) {
      const th = document.createElement('th')
      th.className = 'dpt-preview-select-head'
      const checkbox = document.createElement('input')
      checkbox.type = 'checkbox'
      checkbox.setAttribute('aria-label', 'Pilih semua baris Excel yang tampil')
      checkbox.addEventListener('change', () => {
        tbody.querySelectorAll('tr:not([data-excel-deleted="1"])').forEach(row => {
          const cb = row.querySelector('.dpt-preview-row-check')
          if (cb) cb.checked = checkbox.checked
        })
        updateExcelPreviewToolbar(preview, table)
      })
      th.appendChild(checkbox)
      head.insertBefore(th, head.firstChild)
    }

    tbody.querySelectorAll('tr').forEach(row => {
      if (row.dataset.excelDeleted === '1' || row.querySelector('.dpt-preview-row-check')) return
      const td = document.createElement('td')
      td.className = 'dpt-preview-select-cell'
      const checkbox = document.createElement('input')
      checkbox.type = 'checkbox'
      checkbox.className = 'dpt-preview-row-check'
      checkbox.setAttribute('aria-label', 'Pilih baris Excel')
      checkbox.addEventListener('change', () => updateExcelPreviewToolbar(preview, table))
      td.appendChild(checkbox)
      row.insertBefore(td, row.firstChild)
    })

    let toolbar = preview.querySelector('.dpt-preview-bulk-toolbar')
    if (!toolbar) {
      toolbar = document.createElement('div')
      toolbar.className = 'dpt-preview-bulk-toolbar'
      toolbar.innerHTML = '<div><b>Pilih baris Excel</b><span class="dpt-preview-bulk-count">0 dipilih</span></div><div class="dpt-preview-bulk-actions"><button type="button" class="dpt-preview-select-all">Pilih semua</button><button type="button" class="dpt-preview-clear">Batal pilih</button><button type="button" class="dpt-preview-delete">Hapus dari import</button></div>'
      preview.insertBefore(toolbar, preview.firstChild)
    }

    const selectAll = toolbar.querySelector('.dpt-preview-select-all')
    if (selectAll && !selectAll.dataset.bound) {
      selectAll.dataset.bound = '1'
      selectAll.addEventListener('click', () => {
        tbody.querySelectorAll('tr:not([data-excel-deleted="1"])').forEach(row => {
          const cb = row.querySelector('.dpt-preview-row-check')
          if (cb) cb.checked = true
        })
        const headCb = head.querySelector('.dpt-preview-select-head input')
        if (headCb) headCb.checked = true
        updateExcelPreviewToolbar(preview, table)
      })
    }

    const clear = toolbar.querySelector('.dpt-preview-clear')
    if (clear && !clear.dataset.bound) {
      clear.dataset.bound = '1'
      clear.addEventListener('click', () => {
        tbody.querySelectorAll('.dpt-preview-row-check').forEach(cb => { cb.checked = false })
        const headCb = head.querySelector('.dpt-preview-select-head input')
        if (headCb) headCb.checked = false
        updateExcelPreviewToolbar(preview, table)
      })
    }

    const del = toolbar.querySelector('.dpt-preview-delete')
    if (del && !del.dataset.bound) {
      del.dataset.bound = '1'
      del.addEventListener('click', () => {
        const selectedRows = [...tbody.querySelectorAll('tr:not([data-excel-deleted="1"])')].filter(row => row.querySelector('.dpt-preview-row-check')?.checked)
        const ids = selectedRows.map(row => row.dataset.excelRow).filter(Boolean)
        if (!ids.length) return
        if (!window.confirm(`Keluarkan ${ids.length} baris dari proses import? Data di file Excel asli tidak akan diubah.`)) return
        const merged = [...getDeletedExcelRows(context), ...ids]
        setDeletedExcelRows(context, merged)
        selectedRows.forEach(row => { row.style.display = 'none'; row.dataset.excelDeleted = '1' })
        const headCb = head.querySelector('.dpt-preview-select-head input')
        if (headCb) headCb.checked = false
        updateExcelPreviewToolbar(preview, table)
      })
    }
    updateExcelPreviewToolbar(preview, table)
  })
}

function updateExcelPreviewToolbar(preview, table) {
  const toolbar = preview.querySelector('.dpt-preview-bulk-toolbar')
  if (!toolbar) return
  const rows = [...table.querySelectorAll('tbody tr:not([data-excel-deleted="1"])')]
  const selected = rows.filter(row => row.querySelector('.dpt-preview-row-check')?.checked)
  const count = toolbar.querySelector('.dpt-preview-bulk-count')
  if (count) count.textContent = `${selected.length} dipilih`
  const del = toolbar.querySelector('.dpt-preview-delete')
  if (del) del.disabled = selected.length === 0
  const headCb = table.querySelector('.dpt-preview-select-head input')
  if (headCb) {
    headCb.checked = rows.length > 0 && selected.length === rows.length
    headCb.indeterminate = selected.length > 0 && selected.length < rows.length
  }
}

'''
              text = text.replace(marker, fn + marker)
          text = text.replace('const run = () => ensureRowMarks(context)', 'const run = () => { ensureRowMarks(context); ensureExcelPreviewSelection(context) }')
          dpt.write_text(text, encoding='utf-8')

          contexts = {
              'VehicleExcelImportModalV2.jsx': 'kendaraan',
              'PengajuanExcelImportModal.jsx': 'pengajuan',
              'EditableServiceExcelImportModal.jsx': 'service',
              'VehicleDocumentsImportModal.jsx': 'dokumen',
              'RentalHistoryImportModalV2.jsx': 'sewa',
          }
          moddir = repo / 'modules'
          for filename, context in contexts.items():
              path = moddir / filename
              text = path.read_text(encoding='utf-8')
              if "excelPreviewControls.js" not in text:
                  marker_import = "import { parseXlsx } from '../utils/xlsxParser.js'"
                  text = text.replace(marker_import, marker_import + f"\nimport {{ clearDeletedExcelRows, filterDeletedExcelRows }} from '../utils/excelPreviewControls.js'")
              # reset deletion state whenever a new workbook is scanned
              if f"clearDeletedExcelRows('{context}')" not in text:
                  text = re.sub(r'(const scan\s*=\s*async[^\{]*\{)', rf"\1\n    clearDeletedExcelRows('{context}')", text, count=1)
              # mark preview rows with the real XLSX row number
              text = re.sub(r'<tr key=\{(row\.excelRow|row\.id)\}', r'<tr data-excel-row={row.excelRow} key={\1}', text)
              # filter import inputs at the last safe boundary before database writes
              text = text.replace('importVehicleRows(workbook.valid', "importVehicleRows(filterDeletedExcelRows('kendaraan', workbook.valid)")
              text = text.replace('importDocuments(workbook.valid, profile', "importDocuments(filterDeletedExcelRows('dokumen', workbook.valid), profile")
              text = text.replace('importHistory(rows, profile', "importHistory(filterDeletedExcelRows('service', rows), profile")
              text = text.replace('importSummary(rows, profile', "importSummary(filterDeletedExcelRows('sewa', rows), profile")
              if context == 'pengajuan':
                  if 'const activeRows = filterDeletedExcelRows(\'pengajuan\', rows)' not in text:
                      text = text.replace('    try {\n      const vehicleMap', "    try {\n      const activeRows = filterDeletedExcelRows('pengajuan', rows)\n      const vehicleMap")
                  text = text.replace('for (const row of rows)', 'for (const row of activeRows)')
                  text = text.replace('sourceRows: rows.length', 'sourceRows: activeRows.length')
              path.write_text(text, encoding='utf-8')

          css = repo / 'modules' / 'DataPageTools.css'
          css_text = css.read_text(encoding='utf-8')
          css_text += '''\n\n.dpt-preview-bulk-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:10px 12px;border:1px solid #dbe3ec;border-radius:10px;background:#f8fafc}.dpt-preview-bulk-toolbar>div:first-child{display:flex;align-items:center;gap:8px}.dpt-preview-bulk-count{font-size:12px;color:#64748b}.dpt-preview-bulk-actions{display:flex;gap:7px;flex-wrap:wrap}.dpt-preview-bulk-actions button{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}.dpt-preview-bulk-actions .dpt-preview-delete{color:#b91c1c;border-color:#fecaca}.dpt-preview-bulk-actions button:disabled{opacity:.45;cursor:not-allowed}.dpt-preview-select-head,.dpt-preview-select-cell{width:40px;min-width:40px;text-align:center!important;padding:7px!important}.dpt-preview-select-head input,.dpt-preview-select-cell input{width:16px;height:16px;cursor:pointer}.dpt-preview-bulk-toolbar+.dpt-row-mark-toolbar{margin-top:0}@media(max-width:700px){.dpt-preview-bulk-toolbar{align-items:flex-start;flex-direction:column}.dpt-preview-bulk-actions{width:100%}.dpt-preview-bulk-actions button{flex:1}}\n'''
          css.write_text(css_text, encoding='utf-8')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/modules/DataPageTools.jsx frontend/src/modules/DataPageTools.css frontend/src/modules/VehicleExcelImportModalV2.jsx frontend/src/modules/PengajuanExcelImportModal.jsx frontend/src/modules/EditableServiceExcelImportModal.jsx frontend/src/modules/VehicleDocumentsImportModal.jsx frontend/src/modules/RentalHistoryImportModalV2.jsx frontend/src/utils/excelPreviewControls.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply Excel preview controls [excel-preview-controls]"
          git push
