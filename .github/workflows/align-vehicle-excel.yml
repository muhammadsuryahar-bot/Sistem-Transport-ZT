name: Align vehicle Excel fields
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'muhammadsuryahar-bot' && !contains(github.event.head_commit.message, '[vehicle-excel-aligned]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch master page and export
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/modules/MasterKendaraanPage.jsx')
          s = p.read_text()
          s = s.replace("  kode_kendaraan: '', nomor_polisi: '', merk: '', tipe: '', jenis_kendaraan: '', tahun: '', warna: '', nomor_rangka: '', nomor_mesin: '',\n  kepemilikan:", "  kode_kendaraan: '', nomor_polisi: '', merk: '', tipe: '', jenis_kendaraan: '', tahun: '', warna: '', nomor_rangka: '', nomor_mesin: '',\n  status_pajak: '', unit_kerja: '', catatan_hutang: '',\n  kepemilikan:", 1)
          s = s.replace("nomor_rangka,nomor_mesin,kepemilikan,jenis_sewa,pemilik,driver_id,lokasi,kilometer_terakhir,status,kondisi,keterangan,created_at,updated_at", "nomor_rangka,nomor_mesin,status_pajak,unit_kerja,catatan_hutang,kepemilikan,jenis_sewa,pemilik,driver_id,lokasi,kilometer_terakhir,status,kondisi,keterangan,created_at,updated_at", 1)
          s = s.replace("      lokasi: vehicleForm.lokasi.trim() || null, kilometer_terakhir:", "      lokasi: vehicleForm.lokasi.trim() || null, status_pajak: vehicleForm.status_pajak.trim() || null, unit_kerja: vehicleForm.unit_kerja.trim() || null, catatan_hutang: vehicleForm.catatan_hutang.trim() || null, kilometer_terakhir:", 1)
          s = s.replace("['nomor_mesin','Nomor Mesin'],['pemilik','Pemilik / PIC']", "['nomor_mesin','Nomor Mesin'],['status_pajak','Status Pajak'],['unit_kerja','Unit Kerja'],['pemilik','Pemilik / PIC'],['catatan_hutang','Catatan Hutang']", 1)
          s = s.replace("v.jenis_kendaraan,v.pemilik,v.lokasi,v.kondisi,driver?.nama_lengkap", "v.jenis_kendaraan,v.pemilik,v.lokasi,v.unit_kerja,v.status_pajak,v.kondisi,driver?.nama_lengkap", 1)
          p.write_text(s)

          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text()
          old = "['warna','Warna'],['nomor_rangka','Nomor Rangka'],['nomor_mesin','Nomor Mesin'],['kepemilikan'"
          new = "['warna','Warna'],['nomor_rangka','Nomor Rangka'],['nomor_mesin','Nomor Mesin'],['status_pajak','Status Pajak'],['unit_kerja','Unit Kerja'],['catatan_hutang','Catatan Hutang'],['kepemilikan'"
          if old not in s: raise SystemExit('vehicle export mapping anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/align-vehicle-excel.yml
          git add frontend/src/modules/MasterKendaraanPage.jsx frontend/src/AppTransport.jsx .github/workflows/align-vehicle-excel.yml supabase/migrations/20260909130000_vehicle_excel_master_columns.sql
          git commit -m 'feat: align vehicle Excel fields [vehicle-excel-aligned]' || exit 0
          git push origin main
