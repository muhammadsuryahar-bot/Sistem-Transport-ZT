name: Final Consistency Pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !contains(github.event.head_commit.message, '[final-consistency-pass]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch final files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p, s): Path(p).write_text(s, encoding='utf-8')
          p = 'frontend/src/modules/VehicleExcelImportModalV2.jsx'
          s = read(p)
          s = s.replace("if (['ASET', 'MILIK', 'MILIK KANTOR', 'ASET KANTOR'].includes(ownership)) out.kepemilikan = 'ASET_KANTOR'", "if (['ASET', 'MILIK', 'MILIK KANTOR', 'ASET KANTOR'].includes(ownership)) out.kepemilikan = 'ASET'")
          s = s.replace("else if (!ownership) out.kepemilikan = 'ASET_KANTOR'", "else if (!ownership) out.kepemilikan = 'ASET'")
          write(p, s)
          p = 'frontend/src/AppTransport.jsx'
          s = read(p)
          pattern = re.compile(r"\{ title: 'KENDARAAN', columns: columns\(\[\[.*?\]\]\), rows: cleanRows\(v\.data \|\| \[\]\)\.map\(x => \(\{ \.\.\.x, driver: driverMap\[x\.driver_id\]\?\.nama_lengkap \|\| '-' \}\)\) \},", re.S)
          replacement = "{ title: 'KENDARAAN', columns: columns([['no_export','No'],['nomor_polisi','No. Pol'],['merk','Merk'],['tipe','Type'],['jenis_kendaraan','Jenis'],['tahun','Tahun'],['nomor_mesin','No. Mesin'],['nomor_rangka','No. Rangka'],['pemilik','Pemilik'],['kepemilikan','Status'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak'],['unit_kerja','Unit Kerja'],['driver','Driver'],['lokasi','Lokasi Kerja'],['keterangan','Keterangan'],['catatan_hutang','Catatan Hutang']]), rows: cleanRows(v.data || []).map((x, index) => ({ ...x, no_export: index + 1, kepemilikan: x.kepemilikan === 'ASET' || x.kepemilikan === 'ASET_KANTOR' ? 'Aset' : 'Sewa', driver: driverMap[x.driver_id]?.nama_lengkap || '-' })) },"
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'Kendaraan export block not found: {n}')
          write(p, s)
          for p in ['frontend/src/modules/DataPageTools.jsx','frontend/src/utils/excelPreviewControls.js','frontend/src/modules/PermintaanServicePageFixed.jsx','frontend/src/modules/MasterKendaraanPage.jsx']:
            s = read(p)
            s = re.sub(r'catch \{\}', 'catch { /* intentional no-op */ }', s)
            write(p, s)
          p = 'frontend/src/modules/DataPageTools.jsx'
          s = read(p).replace("function writeRowMarks(value) { try { localStorage.setItem(ROW_MARK_STORAGE, JSON.stringify(value)) } catch { /* intentional no-op */ } }", "function writeRowMarks(value) { try { localStorage.setItem(ROW_MARK_STORAGE, JSON.stringify(value)); return true } catch { return false } }")
          write(p, s)
          p = 'frontend/src/modules/DocumentsFeaturePage.jsx'
          s = read(p).replace("[editing,setEditing]=useState(null),[query,setQuery]=useState(''),[statusFilter,setStatusFilter]=useState('SEMUA'),[selectedDocIds,setSelectedDocIds]=useState([])", "[editing,setEditing]=useState(null),[query]=useState(''),[statusFilter]=useState('SEMUA'),[selectedDocIds,setSelectedDocIds]=useState([])")
          write(p, s)
          p = 'frontend/src/modules/EditableServiceExcelImportModal.jsx'
          s = read(p).replace("const EDITABLE_KEYS = new Set(['source_no', ...Object.keys(ALIASES)])\n", '')
          write(p, s)
          p = 'frontend/src/modules/MasterKendaraanPage.jsx'
          s = read(p).replace('const current = detail; setDetail(null); openVehicle(current)', 'setDetail(null); openVehicle(detail)')
          write(p, s)
          PY
      - name: Verify lint
        working-directory: frontend
        run: npm ci && npm run lint
      - name: Verify build
        working-directory: frontend
        run: npm run build
      - name: Commit verified changes
        shell: bash
        run: |
          if git diff --quiet; then echo 'No changes required.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src
          git commit -m 'fix: finalize Excel-aligned vehicle consistency [final-consistency-pass]'
          git push origin HEAD:main
# final verification trigger
