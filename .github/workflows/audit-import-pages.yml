name: Audit transport Excel imports
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: "${{ !contains(github.event.head_commit.message, '[import-audit-done]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply audited Excel fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          # Vehicle: source workbook is 84 rows -> 84 valid -> 74 unique -> 10 duplicate rows.
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text()
          old = '<div className="vehicle-import-explanation"><b>Kenapa jumlah kendaraan bisa lebih sedikit?</b><span>Excel menghitung baris sumber, sedangkan Master Kendaraan menghitung No. Polisi unik.</span><span>Contoh file ini: 83 baris kendaraan valid → 73 No. Polisi unik → 10 baris duplikat digabung.</span><span>Jadi apabila setelah import terlihat 73 kendaraan, itu bukan 10 kendaraan hilang.</span></div>'
          new = '<div className="vehicle-import-explanation"><b>Kenapa jumlah kendaraan bisa lebih sedikit?</b><span>Excel menghitung baris sumber, sedangkan Master Kendaraan menghitung No. Polisi unik.</span><span>File ini: {selected.data.length} baris sumber → {selected.valid.length} baris valid → {selected.uniqueCount} No. Polisi unik → {selected.duplicateCount} baris duplikat digabung.</span><span>{selected.duplicateCount > 0 ? \'Baris dengan No. Polisi yang sama digabung menjadi satu kendaraan; bukan berarti kendaraan hilang.\' : \'Tidak ada duplikat No. Polisi pada file ini.\'}</span></div>'
          if old not in s: raise SystemExit('Vehicle hardcoded explanation not found')
          p.write_text(s.replace(old, new, 1))

          # Documents: standardize 25 MB and expose structured import report.
          p = Path('frontend/src/modules/VehicleDocumentsImportModal.jsx')
          s = p.read_text()
          s = s.replace('const MAX_FILE_SIZE = 10 * 1024 * 1024', 'const MAX_FILE_SIZE = 25 * 1024 * 1024', 1)
          s = s.replace('Ukuran file maksimal 10 MB.', 'Ukuran file maksimal 25 MB.', 1)
          s = s.replace(":'Maksimal 10 MB'", ":'Maksimal 25 MB'", 1)
          old = "const start = async () => { if (!workbook || !canImport || saving) return; setSaving(true); setError(''); setMessage('Import dokumen berjalan...'); try { const result = await importDocuments(workbook.valid, profile, workbook.sheet.name); const unknownText = result.unknown.length ? ` • ${result.unknown.length} plat tidak ada di master` : ''; setMessage(`Import selesai: ${result.inserted} dokumen baru • ${result.skipped} sudah ada • ${result.taxUpdated} masa pajak master disinkronkan${unknownText}.`); if (result.unknown.length) setError(`Plat belum ada di Master Kendaraan: ${result.unknown.slice(0, 20).join(', ')}${result.unknown.length > 20 ? ' …' : ''}. Data dokumen tersebut tidak dibuat.`); onDone?.() } catch (e) { setError(e.message || 'Import dokumen gagal.'); setMessage('') } finally { setSaving(false) } }"
          new = "const start = async () => { if (!workbook || !canImport || saving) return; setSaving(true); setError(''); setMessage('Import dokumen berjalan...'); try { const result = await importDocuments(workbook.valid, profile, workbook.sheet.name); const unknownText = result.unknown.length ? ` • ${result.unknown.length} plat tidak ada di master` : ''; const report = { context: 'dokumen', ...result, validRows: workbook.valid.length, imported: result.inserted, mergedDuplicates: result.skipped, unknownPlates: result.unknown, fileName: file?.name || '', completedAt: new Date().toISOString() }; sessionStorage.setItem('transport_import_report', JSON.stringify(report)); setMessage(`Import selesai: ${result.inserted} dokumen baru • ${result.skipped} sudah ada • ${result.taxUpdated} masa pajak master disinkronkan${unknownText}.`); if (result.unknown.length) setError(`Plat belum ada di Master Kendaraan: ${result.unknown.slice(0, 20).join(', ')}${result.unknown.length > 20 ? ' …' : ''}. Data dokumen tersebut tidak dibuat.`); onDone?.(report) } catch (e) { setError(e.message || 'Import dokumen gagal.'); setMessage('') } finally { setSaving(false) } }"
          if old not in s: raise SystemExit('Document start block not found')
          p.write_text(s.replace(old, new, 1))

          # Service history: close the linked historical request and expose a structured result.
          p = Path('frontend/src/modules/ServiceHistoryImportModal.jsx')
          s = p.read_text()
          old = "if (completed.error) throw new Error(`Gagal menandai histori service ${first.nomor_polisi} selesai: ${completed.error.message}`)\n\n    if (shouldUpdateKm) {"
          new = "if (completed.error) throw new Error(`Gagal menandai histori service ${first.nomor_polisi} selesai: ${completed.error.message}`)\n\n    const requestCompleted = await supabase.from('permintaan_service').update({ status: 'SELESAI' }).eq('id', request.data.id)\n    if (requestCompleted.error) throw new Error(`Gagal menutup histori pengajuan ${first.nomor_polisi}: ${requestCompleted.error.message}`)\n\n    if (shouldUpdateKm) {"
          if old not in s: raise SystemExit('Service completion block not found')
          s = s.replace(old, new, 1)
          old = "onDone?.()"
          new = "const report = { context: 'service', ...result, fileName: file?.name || '', completedAt: new Date().toISOString() }\n      sessionStorage.setItem('transport_import_report', JSON.stringify(report))\n      onDone?.(report)"
          if old not in s: raise SystemExit('Service onDone block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Generic importer: standardize 25 MB, protect legacy FPD block-form sheets, and emit a result report.
          p = Path('frontend/src/modules/UnifiedExcelImportModal.jsx')
          s = p.read_text()
          s = s.replace('const MAX_FILE_SIZE = 10 * 1024 * 1024', 'const MAX_FILE_SIZE = 25 * 1024 * 1024', 1)
          s = s.replace('Ukuran file maksimal 10 MB.', 'Ukuran file maksimal 25 MB.', 1)
          s = s.replace('Hanya .xlsx • maksimal 10 MB', 'Hanya .xlsx • maksimal 25 MB', 1)
          old = "      const sheets = prepareSheets(await parseXlsx(nextFile), context)\n      const candidate = sheets[0]\n      if (!candidate || candidate.score < 4) throw new Error(`Data ${LABELS[context]} tidak ditemukan secara meyakinkan. Periksa nama sheet dan header Excel.`)"
          new = "      const sheets = prepareSheets(await parseXlsx(nextFile), context)\n      const normalizedNames = sheets.map((sheet) => norm(sheet.name))\n      if (context === 'pengajuan' && normalizedNames.some((name) => name === 'permintaan_perbaikan')) throw new Error('Sheet PERMINTAAN PERBAIKAN pada FPD OPS adalah formulir blok historis, bukan tabel. Import otomatis sengaja dihentikan agar data tidak salah mapping.')\n      if (context === 'sewa' && normalizedNames.some((name) => name === 'sewa_kendaraan' || name === 'summery_rental')) throw new Error('Sheet Sewa KEndaraan/SUMMERY RENTAL pada FPD OPS bukan format kontrak tabular yang dibutuhkan halaman Kendaraan Sewa. Import otomatis dihentikan agar pembayaran tidak salah dicatat sebagai kontrak.')\n      const candidate = sheets[0]\n      if (!candidate || candidate.score < 4) throw new Error(`Data ${LABELS[context]} tidak ditemukan secara meyakinkan. Periksa nama sheet dan header Excel.`)"
          if old not in s: raise SystemExit('Generic scan block not found')
          s = s.replace(old, new, 1)
          old = "      const result = await IMPORTERS[context](selected, profile)\n      setMessage(`Import ${LABELS[context]} berhasil. ${result}`)\n      onDone?.()"
          new = "      const result = await IMPORTERS[context](selected, profile)\n      const report = { context, sourceRows: dataRows(selected).length, validRows: dataRows(selected).length, imported: Number((String(result).match(/^(\\d+)/) || [0, 0])[1]), message: result, fileName: file?.name || '', completedAt: new Date().toISOString() }\n      sessionStorage.setItem('transport_import_report', JSON.stringify(report))\n      setMessage(`Import ${LABELS[context]} berhasil. ${result}`)\n      onDone?.(report)"
          if old not in s: raise SystemExit('Generic start block not found')
          p.write_text(s.replace(old, new, 1))

          # Result modal: show detailed importer message when present.
          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          anchor = "        </div>\n\n        {importReport.context === 'kendaraan' && <div className=\"vehicle-import-note\">"
          repl = "        </div>\n\n        {importReport.message && <div className=\"vehicle-import-note\"><b>Detail hasil import</b><span>{importReport.message}</span></div>}\n\n        {importReport.context === 'kendaraan' && <div className=\"vehicle-import-note\">"
          if anchor not in s: raise SystemExit('Report modal anchor not found')
          p.write_text(s.replace(anchor, repl, 1))

          # Legacy Import Excel page: at least enforce the same 25 MB file limit.
          p = Path('frontend/src/modules/ImportExcelPage.jsx')
          s = p.read_text()
          marker = "const KEYWORDS = {"
          if 'const MAX_FILE_SIZE = 25 * 1024 * 1024' not in s:
              idx = s.find(marker)
              if idx < 0: raise SystemExit('ImportExcelPage anchor not found')
              s = s[:idx] + "const MAX_FILE_SIZE = 25 * 1024 * 1024\n\n" + s[idx:]
          old = "    if (!/\\.xlsx$/i.test(selectedFile.name)) { setError('Gunakan file Excel .xlsx. Format .xls lama belum didukung untuk import aman.'); return }\n    setLoading(true)"
          new = "    if (!/\\.xlsx$/i.test(selectedFile.name)) { setError('Gunakan file Excel .xlsx. Format .xls lama belum didukung untuk import aman.'); return }\n    if (selectedFile.size > MAX_FILE_SIZE) { setError('Ukuran file maksimal 25 MB.'); return }\n    setLoading(true)"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Remove this audit workflow after the patch so it does not remain as a permanent job.
          Path('.github/workflows/audit-import-pages.yml').unlink(missing_ok=True)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/VehicleExcelImportModal.jsx frontend/src/modules/VehicleDocumentsImportModal.jsx frontend/src/modules/ServiceHistoryImportModal.jsx frontend/src/modules/UnifiedExcelImportModal.jsx frontend/src/modules/DataPageTools.jsx frontend/src/modules/ImportExcelPage.jsx .github/workflows/audit-import-pages.yml
          git commit -m 'fix all Excel import pages [import-audit-done]' || exit 0
          git push