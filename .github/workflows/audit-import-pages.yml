name: Audit transport Excel imports
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply audited Excel fixes
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[import-audit-done]"* ]]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path

          # Vehicle reconciliation: the supplied Data Kendaraan workbook has 84 source rows, 74 unique plates and 10 duplicate rows.
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text()
          s = s.replace('Contoh file ini: 83 baris kendaraan valid → 73 No. Polisi unik → 10 baris duplikat digabung.', 'File ini: {selected.data.length} baris sumber → {selected.valid.length} baris valid → {selected.uniqueCount} No. Polisi unik → {selected.duplicateCount} baris duplikat digabung.', 1)
          s = s.replace('Jadi apabila setelah import terlihat 73 kendaraan, itu bukan 10 kendaraan hilang.', "{selected.duplicateCount > 0 ? 'Baris dengan No. Polisi yang sama digabung menjadi satu kendaraan; bukan berarti kendaraan hilang.' : 'Tidak ada duplikat No. Polisi pada file ini.'}", 1)
          if 'duplicateGroups' not in s:
              s = s.replace('      const nums = valid.map((r) => Number(r.sourceNo)).filter(Number.isFinite).map((n) => Math.trunc(n));', "      const duplicateGroups = [...groups.entries()].filter(([, rows]) => rows.length > 1).map(([plate, rows]) => ({ plate, sourceRows: rows.map((r) => r.excelRow) }));\n      const nums = valid.map((r) => Number(r.sourceNo)).filter(Number.isFinite).map((n) => Math.trunc(n));", 1)
              s = s.replace('setWorkbook({ sheet: chosen, header, data, valid, uniqueCount: groups.size, duplicateCount: valid.length - groups.size, missingSourceNumbers: missing, previewRows })', 'setWorkbook({ sheet: chosen, header, data, valid, uniqueCount: groups.size, duplicateCount: valid.length - groups.size, duplicateGroups, missingSourceNumbers: missing, previewRows })', 1)
          if 'vehicle-import-duplicates' not in s:
              s = s.replace('      <div className="vehicle-import-map">{EXPECTED_HEADERS.map', '      {selected.duplicateGroups?.length > 0 && <details className="vehicle-import-duplicates"><summary>Lihat {selected.duplicateGroups.length} grup No. Polisi yang digabung</summary><div>{selected.duplicateGroups.map((group) => <div key={group.plate}><b>{group.plate}</b><span>Baris Excel: {group.sourceRows.join(\', \')}</span></div>)}</div></details>}\n      <div className="vehicle-import-map">{EXPECTED_HEADERS.map', 1)
          p.write_text(s)

          # Documents: common 25 MB standard and structured result report.
          p = Path('frontend/src/modules/VehicleDocumentsImportModal.jsx')
          s = p.read_text()
          s = s.replace('const MAX_FILE_SIZE = 10 * 1024 * 1024', 'const MAX_FILE_SIZE = 25 * 1024 * 1024', 1)
          s = s.replace('Ukuran file maksimal 10 MB.', 'Ukuran file maksimal 25 MB.', 1)
          s = s.replace(":'Maksimal 10 MB'", ":'Maksimal 25 MB'", 1)
          s = s.replace('onDone?.() } catch (e) { setError(e.message || \'Import dokumen gagal.\'); setMessage(\'\') }', "const report = { context: 'dokumen', ...result, validRows: workbook.valid.length, imported: result.inserted, skipped: result.skipped, unknownPlates: result.unknown, documentCount: workbook.docCount, fileName: file?.name || '', completedAt: new Date().toISOString() }; sessionStorage.setItem('transport_import_report', JSON.stringify(report)); onDone?.(report) } catch (e) { setError(e.message || 'Import dokumen gagal.'); setMessage('') }", 1)
          p.write_text(s)

          # Service histori: finish the technical linked request as historical/complete, and report the import.
          p = Path('frontend/src/modules/ServiceHistoryImportModal.jsx')
          s = p.read_text()
          anchor = "if (completed.error) throw new Error(`Gagal menandai histori service ${first.nomor_polisi} selesai: ${completed.error.message}`)\n\n    if (shouldUpdateKm) {"
          replacement = "if (completed.error) throw new Error(`Gagal menandai histori service ${first.nomor_polisi} selesai: ${completed.error.message}`)\n\n    const requestCompleted = await supabase.from('permintaan_service').update({ status: 'SELESAI' }).eq('id', request.data.id)\n    if (requestCompleted.error) throw new Error(`Gagal menutup histori pengajuan ${first.nomor_polisi}: ${requestCompleted.error.message}`)\n\n    if (shouldUpdateKm) {"
          if anchor not in s: raise SystemExit('service completion anchor not found')
          s = s.replace(anchor, replacement, 1)
          if 'sessionStorage.setItem(\'transport_import_report\'' not in s:
              s = s.replace('      onDone?.()\n    } catch (e) {', "      const report = { context: 'service', ...result, validRows: workbook.valid.length, transactions: result.imported, fileName: file?.name || '', completedAt: new Date().toISOString() }\n      sessionStorage.setItem('transport_import_report', JSON.stringify(report))\n      onDone?.(report)\n    } catch (e) {", 1)
          p.write_text(s)

          # Unified: 25 MB and refuse the known FPD block forms instead of silently mapping them as tables.
          p = Path('frontend/src/modules/UnifiedExcelImportModal.jsx')
          s = p.read_text()
          s = s.replace('const MAX_FILE_SIZE = 10 * 1024 * 1024', 'const MAX_FILE_SIZE = 25 * 1024 * 1024', 1)
          s = s.replace('Ukuran file maksimal 10 MB.', 'Ukuran file maksimal 25 MB.', 1)
          s = s.replace('Hanya .xlsx • maksimal 10 MB', 'Hanya .xlsx • maksimal 25 MB', 1)
          old = '''    try {
      const sheets = prepareSheets(await parseXlsx(nextFile), context)
      const candidate = sheets[0]
      if (!candidate || candidate.score < 4) throw new Error(`Data ${LABELS[context]} tidak ditemukan secara meyakinkan. Periksa nama sheet dan header Excel.`)
      setSelected(candidate)
      setMessage(`Sheet “${candidate.name}” terdeteksi • ${dataRows(candidate).length} baris data.`)
    } catch (e) { setError(e.message || 'File Excel tidak dapat dibaca.') } finally { setLoading(false) }
'''
          new = '''    try {
      const sheets = prepareSheets(await parseXlsx(nextFile), context)
      const candidate = sheets[0]
      const candidateName = norm(candidate?.name || '')
      if (context === 'pengajuan' && ['permintaan_perbaikan', 'pengajuan_perbaikan'].includes(candidateName)) throw new Error('Sheet Pengajuan Perbaikan/PERMINTAAN PERBAIKAN pada FPD OPS adalah formulir blok historis, bukan tabel pengajuan. Import otomatis dihentikan agar data tidak salah mapping.')
      if (context === 'sewa' && ['sewa_kendaraan', 'summery_rental'].includes(candidateName)) throw new Error('Sheet Sewa KEndaraan/SUMMERY RENTAL pada FPD OPS berisi formulir dana dan rekap pembayaran, bukan tabel kontrak sewa. Import otomatis dihentikan agar pembayaran tidak salah dicatat sebagai kontrak.')
      if (!candidate || candidate.score < 4) throw new Error(`Data ${LABELS[context]} tidak ditemukan secara meyakinkan. Periksa nama sheet dan header Excel.`)
      setSelected(candidate)
      setMessage(`Sheet “${candidate.name}” terdeteksi • ${dataRows(candidate).length} baris data.`)
    } catch (e) { setError(e.message || 'File Excel tidak dapat dibaca.') } finally { setLoading(false) }
'''
          if old not in s: raise SystemExit('unified scan block not found')
          s = s.replace(old, new, 1)
          old = '''      const result = await IMPORTERS[context](selected, profile)
      setMessage(`Import ${LABELS[context]} berhasil. ${result}`)
      onDone?.()
'''
          new = '''      const result = await IMPORTERS[context](selected, profile)
      const report = { context, sourceRows: dataRows(selected).length, validRows: dataRows(selected).length, imported: Number((String(result).match(/^(\\d+)/) || [0, 0])[1]), message: result, fileName: file?.name || '', completedAt: new Date().toISOString() }
      sessionStorage.setItem('transport_import_report', JSON.stringify(report))
      setMessage(`Import ${LABELS[context]} berhasil. ${result}`)
      onDone?.(report)
'''
          if old not in s: raise SystemExit('unified start block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Result modal shows detail text from generic importers.
          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          anchor = '        </div>\n\n        {importReport.context === \'kendaraan\' && <div className="vehicle-import-note">'
          detail = '        </div>\n\n        {importReport.message && <div className="vehicle-import-note"><b>Detail hasil import</b><span>{importReport.message}</span></div>}\n\n        {importReport.context === \'kendaraan\' && <div className="vehicle-import-note">'
          if anchor in s and 'Detail hasil import' not in s: s = s.replace(anchor, detail, 1)
          p.write_text(s)

          # Legacy direct import screen: enforce the same 25 MB limit.
          p = Path('frontend/src/modules/ImportExcelPage.jsx')
          s = p.read_text()
          if 'const MAX_FILE_SIZE = 25 * 1024 * 1024' not in s: s = s.replace('const KEYWORDS = {', 'const MAX_FILE_SIZE = 25 * 1024 * 1024\n\nconst KEYWORDS = {', 1)
          if 'selectedFile.size > MAX_FILE_SIZE' not in s: s = s.replace("    if (!/\\.xlsx$/i.test(selectedFile.name)) { setError('Gunakan file Excel .xlsx. Format .xls lama belum didukung untuk import aman.'); return }\n    setLoading(true)", "    if (!/\\.xlsx$/i.test(selectedFile.name)) { setError('Gunakan file Excel .xlsx. Format .xls lama belum didukung untuk import aman.'); return }\n    if (selectedFile.size > MAX_FILE_SIZE) { setError('Ukuran file maksimal 25 MB.'); return }\n    setLoading(true)", 1)
          p.write_text(s)
          PY
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Remove audit workflow and commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/audit-import-pages.yml
          git add frontend/src/modules/VehicleExcelImportModal.jsx frontend/src/modules/VehicleDocumentsImportModal.jsx frontend/src/modules/ServiceHistoryImportModal.jsx frontend/src/modules/UnifiedExcelImportModal.jsx frontend/src/modules/DataPageTools.jsx frontend/src/modules/ImportExcelPage.jsx
          git commit -m 'fix all Excel import pages [import-audit-done]'
          git push