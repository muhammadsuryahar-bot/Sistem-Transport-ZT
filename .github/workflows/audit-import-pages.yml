name: Audit transport Excel imports
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch import modules
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[import-audit-done]"* ]]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path

          # Vehicle reconciliation text must reflect the actual workbook dynamically.
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text()
          s = s.replace('Contoh file ini: 83 baris kendaraan valid → 73 No. Polisi unik → 10 baris duplikat digabung.', 'File ini: {selected.data.length} baris sumber → {selected.valid.length} baris valid → {selected.uniqueCount} No. Polisi unik → {selected.duplicateCount} baris duplikat digabung.')
          s = s.replace('Jadi apabila setelah import terlihat 73 kendaraan, itu bukan 10 kendaraan hilang.', "{selected.duplicateCount > 0 ? 'Baris dengan No. Polisi yang sama digabung menjadi satu kendaraan; bukan berarti kendaraan hilang.' : 'Tidak ada duplikat No. Polisi pada file ini.'}")
          p.write_text(s)

          # Documents: 25 MB standard and structured report.
          p = Path('frontend/src/modules/VehicleDocumentsImportModal.jsx')
          s = p.read_text()
          s = s.replace('const MAX_FILE_SIZE = 10 * 1024 * 1024', 'const MAX_FILE_SIZE = 25 * 1024 * 1024')
          s = s.replace('Ukuran file maksimal 10 MB.', 'Ukuran file maksimal 25 MB.')
          s = s.replace(":'Maksimal 10 MB'", ":'Maksimal 25 MB'")
          if "sessionStorage.setItem('transport_import_report'" not in s:
              s = s.replace("onDone?.() } catch (e) { setError(e.message || 'Import dokumen gagal.'); setMessage('') } finally { setSaving(false) } }", "const report = { context: 'dokumen', ...result, validRows: workbook.valid.length, imported: result.inserted, skipped: result.skipped, unknownPlates: result.unknown, documentCount: workbook.docCount, fileName: file?.name || '', completedAt: new Date().toISOString() }; sessionStorage.setItem('transport_import_report', JSON.stringify(report)); onDone?.(report) } catch (e) { setError(e.message || 'Import dokumen gagal.'); setMessage('') } finally { setSaving(false) } }")
          p.write_text(s)

          # Service: close the temporary historical request after the service itself is completed.
          p = Path('frontend/src/modules/ServiceHistoryImportModal.jsx')
          s = p.read_text()
          anchor = "if (completed.error) throw new Error(`Gagal menandai histori service ${first.nomor_polisi} selesai: ${completed.error.message}`)\n\n    if (shouldUpdateKm) {"
          replacement = "if (completed.error) throw new Error(`Gagal menandai histori service ${first.nomor_polisi} selesai: ${completed.error.message}`)\n\n    const requestCompleted = await supabase.from('permintaan_service').update({ status: 'SELESAI' }).eq('id', request.data.id)\n    if (requestCompleted.error) throw new Error(`Gagal menutup histori pengajuan ${first.nomor_polisi}: ${requestCompleted.error.message}`)\n\n    if (shouldUpdateKm) {"
          if anchor in s and "Gagal menutup histori pengajuan" not in s:
              s = s.replace(anchor, replacement, 1)
          if "sessionStorage.setItem('transport_import_report'" not in s:
              s = s.replace("onDone?.()", "const report = { context: 'service', ...result, validRows: workbook.valid.length, transactions: result.imported, fileName: file?.name || '', completedAt: new Date().toISOString() }; sessionStorage.setItem('transport_import_report', JSON.stringify(report)); onDone?.(report)", 1)
          p.write_text(s)

          # Unified: 25 MB standard, block known non-tabular FPD source sheets, and return a report.
          p = Path('frontend/src/modules/UnifiedExcelImportModal.jsx')
          s = p.read_text()
          s = s.replace('const MAX_FILE_SIZE = 10 * 1024 * 1024', 'const MAX_FILE_SIZE = 25 * 1024 * 1024')
          s = s.replace('Ukuran file maksimal 10 MB.', 'Ukuran file maksimal 25 MB.')
          s = s.replace('Hanya .xlsx • maksimal 10 MB', 'Hanya .xlsx • maksimal 25 MB')
          if 'candidateName' not in s:
              old = """    try {\n      const sheets = prepareSheets(await parseXlsx(nextFile), context)\n      const candidate = sheets[0]\n      if (!candidate || candidate.score < 4) throw new Error(`Data ${LABELS[context]} tidak ditemukan secara meyakinkan. Periksa nama sheet dan header Excel.`)\n      setSelected(candidate)\n"""
              new = """    try {\n      const sheets = prepareSheets(await parseXlsx(nextFile), context)\n      const candidate = sheets[0]\n      const candidateName = norm(candidate?.name || '')\n      if (context === 'pengajuan' && ['permintaan_perbaikan', 'pengajuan_perbaikan'].includes(candidateName)) throw new Error('Sheet Pengajuan Perbaikan/PERMINTAAN PERBAIKAN pada FPD OPS adalah formulir blok historis, bukan tabel pengajuan. Import otomatis dihentikan agar data tidak salah mapping.')\n      if (context === 'sewa' && ['sewa_kendaraan', 'summery_rental'].includes(candidateName)) throw new Error('Sheet Sewa KEndaraan/SUMMERY RENTAL pada FPD OPS berisi formulir dana dan rekap pembayaran, bukan tabel kontrak sewa. Import otomatis dihentikan agar pembayaran tidak salah dicatat sebagai kontrak.')\n      if (!candidate || candidate.score < 4) throw new Error(`Data ${LABELS[context]} tidak ditemukan secara meyakinkan. Periksa nama sheet dan header Excel.`)\n      setSelected(candidate)\n"""
              s = s.replace(old, new, 1)
          if "sessionStorage.setItem('transport_import_report'" not in s:
              old_start = """      const result = await IMPORTERS[context](selected, profile)\n      setMessage(`Import ${LABELS[context]} berhasil. ${result}`)\n      onDone?.()\n"""
              new_start = """      const result = await IMPORTERS[context](selected, profile)\n      const report = { context, sourceRows: dataRows(selected).length, validRows: dataRows(selected).length, imported: Number((String(result).match(/^(\\d+)/) || [0, 0])[1]), message: result, fileName: file?.name || '', completedAt: new Date().toISOString() }\n      sessionStorage.setItem('transport_import_report', JSON.stringify(report))\n      setMessage(`Import ${LABELS[context]} berhasil. ${result}`)\n      onDone?.(report)\n"""
              s = s.replace(old_start, new_start, 1)
          p.write_text(s)

          # Common result modal: show textual detail for generic importers.
          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          anchor = "        </div>\n\n        {importReport.context === 'kendaraan' && <div className=\"vehicle-import-note\">"
          if 'Detail hasil import' not in s and anchor in s:
              s = s.replace(anchor, "        </div>\n\n        {importReport.message && <div className=\"vehicle-import-note\"><b>Detail hasil import</b><span>{importReport.message}</span></div>}\n\n        {importReport.context === 'kendaraan' && <div className=\"vehicle-import-note\">", 1)
          p.write_text(s)

          # Legacy import screen: enforce the same 25 MB standard.
          p = Path('frontend/src/modules/ImportExcelPage.jsx')
          s = p.read_text()
          if 'const MAX_FILE_SIZE = 25 * 1024 * 1024' not in s:
              s = s.replace('const KEYWORDS = {', 'const MAX_FILE_SIZE = 25 * 1024 * 1024\n\nconst KEYWORDS = {', 1)
          if 'selectedFile.size > MAX_FILE_SIZE' not in s:
              s = s.replace("    if (!/\\.xlsx$/i.test(selectedFile.name)) { setError('Gunakan file Excel .xlsx. Format .xls lama belum didukung untuk import aman.'); return }\n    setLoading(true)", "    if (!/\\.xlsx$/i.test(selectedFile.name)) { setError('Gunakan file Excel .xlsx. Format .xls lama belum didukung untuk import aman.'); return }\n    if (selectedFile.size > MAX_FILE_SIZE) { setError('Ukuran file maksimal 25 MB.'); return }\n    setLoading(true)", 1)
          p.write_text(s)
          PY
          git diff --stat
      - name: Commit audited fixes
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[import-audit-done]"* ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/VehicleExcelImportModal.jsx frontend/src/modules/VehicleDocumentsImportModal.jsx frontend/src/modules/ServiceHistoryImportModal.jsx frontend/src/modules/UnifiedExcelImportModal.jsx frontend/src/modules/DataPageTools.jsx frontend/src/modules/ImportExcelPage.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix all Excel import pages [import-audit-done]'
          git push