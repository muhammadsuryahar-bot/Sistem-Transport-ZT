name: One-time profile null crash fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Patch AppTransport profile access
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/AppTransport.jsx')
          text = path.read_text(encoding='utf-8')
          patched = text.replace('profile.', 'profile?.')
          if patched == text:
              raise SystemExit('No profile access pattern found; refusing to create empty repair commit.')
          path.write_text(patched, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-null-profile-fix.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/AppTransport.jsx .github/workflows/one-time-null-profile-fix.yml
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Fix profile null render crash'
          git push origin main
