name: Temporary Regex Lint Fixer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix-regex]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove only verified unnecessary regex escapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
              r"/^\d{1,2}[-/\\-]\d{1,2}[\\/-]\d{4}$/": r"/^\d{1,2}[-/]\d{1,2}[-/]\d{4}$/",
              "v.split(/[\\/-]/)": "v.split(/[-/]/)",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify lint and build before commit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/modules/VehicleExcelImportModal.jsx .github/workflows/fix-lint-regex.yml
          git rm .github/workflows/fix-lint-regex.yml
          git commit -m "[lint-fix-regex] clear verified vehicle regex lint errors"
          git push origin HEAD:main
