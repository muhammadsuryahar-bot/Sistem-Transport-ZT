name: Apply vehicle workbook mapping on PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'muhammadsuryahar-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Patch vehicle workbook mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # DataPageTools: exact workbook sheet priority + complete vehicle fields.
          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          s = s.replace("kendaraan: ['data kendaraan'],", "kendaraan: ['data kendaraan', 'list kendaraan'],", 1)
          s = s.replace(
              "const rows = sheet.rows.slice(index + 1).filter(r => r.some(v => clean(v)))\n  const h = headers.map(norm)",
              "const rows = contextRows(sheet, 'kendaraan')\n  const h = headers.map(norm)",
              1,
          )
          # Preserve tax expiry directly on kendaraan as well as the STNK record.
          s = s.replace(
              "unit_kerja: valueOf(row, headers, 'unit_kerja') || null,\n      kilometer_terakhir:",
              "unit_kerja: valueOf(row, headers, 'unit_kerja') || null,\n      masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak')),\n      kilometer_terakhir:",
              1,
          )
          p.write_text(s)

          # MasterKendaraan: expose every meaningful workbook field.
          p = Path('frontend/src/modules/MasterKendaraanPage.jsx')
          s = p.read_text()
          s = s.replace(
              "nomor_polisi: '', merk: '', tipe: '', jenis_kendaraan: '', tahun: '', warna: '', nomor_rangka: '', nomor_mesin: '',\n  status_pajak:",
              "nomor_polisi: '', merk: '', tipe: '', jenis_kendaraan: '', tahun: '', warna: '', nomor_rangka: '', nomor_mesin: '', masa_berlaku_pajak: '',\n  status_pajak:",
              1,
          )
          s = s.replace(
              "nomor_mesin,status_pajak,unit_kerja,catatan_hutang,kepemilikan",
              "nomor_mesin,masa_berlaku_pajak,status_pajak,unit_kerja,catatan_hutang,kepemilikan",
              1,
          )
          s = s.replace(
              "nomor_rangka: vehicleForm.nomor_rangka.trim() || null, nomor_mesin: vehicleForm.nomor_mesin.trim() || null, kepemilikan:",
              "nomor_rangka: vehicleForm.nomor_rangka.trim() || null, nomor_mesin: vehicleForm.nomor_mesin.trim() || null, masa_berlaku_pajak: vehicleForm.masa_berlaku_pajak || null, kepemilikan:",
              1,
          )
          s = s.replace(
              "['nomor_mesin','Nomor Mesin'],['status_pajak','Status Pajak']",
              "['nomor_mesin','Nomor Mesin'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak']",
              1,
          )
          s = s.replace(
              "['Lokasi',detail.lokasi],['KM Terakhir',fmtKm(detail.kilometer_terakhir)]",
              "['Lokasi',detail.lokasi],['Unit Kerja',detail.unit_kerja],['Masa Berlaku Pajak',detail.masa_berlaku_pajak],['Status Pajak',detail.status_pajak],['Catatan Hutang',detail.catatan_hutang],['KM Terakhir',fmtKm(detail.kilometer_terakhir)]",
              1,
          )
          p.write_text(s)

          # AppTransport export: export the same source fields.
          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text()
          old = "['pemilik','Pemilik / PIC'],['driver','Driver'],['lokasi','Lokasi'],['kilometer_terakhir','KM Terakhir']"
          new = "['pemilik','Pemilik / PIC'],['driver','Driver'],['lokasi','Lokasi'],['unit_kerja','Unit Kerja'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak'],['catatan_hutang','Catatan Hutang'],['kilometer_terakhir','KM Terakhir']"
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit fixes to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-vehicle-import-fields.yml .github/workflows/vehicle-fields-pr-fix.yml
          git add frontend/src/modules/DataPageTools.jsx frontend/src/modules/MasterKendaraanPage.jsx frontend/src/AppTransport.jsx .github/workflows/patch-vehicle-import-fields.yml .github/workflows/vehicle-fields-pr-fix.yml
          git commit -m "fix: match vehicle import fields to workbook" || exit 0
          git push origin HEAD:${GITHUB_HEAD_REF}
