name: Temporary Final Lint Fixer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix-final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix final unused state binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text(encoding='utf-8')
          old = '  const [exportingPage, setExportingPage] = useState(false)\n'
          new = '  const [, setExportingPage] = useState(false)\n'
          if old not in s:
              raise SystemExit('Expected exportingPage declaration was not found.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify lint and build before commit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/AppTransport.jsx .github/workflows/fix-lint-final.yml
          git rm .github/workflows/fix-lint-final.yml
          git commit -m "[lint-fix-final] clear final frontend lint error"
          git push origin HEAD:main
