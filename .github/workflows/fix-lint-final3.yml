name: Temporary Final Lint Fixer 3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[lint-fix-final3]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix verified remaining issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/modules/VehicleExcelImportModal.jsx')
          s = p.read_text(encoding='utf-8')
          old = "replace(/^//, '')"
          new = "replace(/^\\//, '')"
          if old not in s:
              raise SystemExit('Vehicle importer path regex is not in the expected broken form.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text(encoding='utf-8')
          old = 'const [exportingPage, setExportingPage] = useState(false)'
          new = 'const [, setExportingPage] = useState(false)'
          if old not in s:
              raise SystemExit('AppTransport exportingPage declaration is not in the expected form.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify lint and build before commit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/AppTransport.jsx frontend/src/modules/VehicleExcelImportModal.jsx .github/workflows/fix-lint-final3.yml
          git rm .github/workflows/fix-lint-final3.yml
          git commit -m "[lint-fix-final3] clear remaining lint and build errors"
          git push origin HEAD:main
