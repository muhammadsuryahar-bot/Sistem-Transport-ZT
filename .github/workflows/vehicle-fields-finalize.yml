name: Finalize vehicle workbook mapping

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'muhammadsuryahar-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Finalize vehicle import mapping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # DataPageTools
          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          s = s.replace("kendaraan: ['data kendaraan'],", "kendaraan: ['data kendaraan', 'list kendaraan'],", 1)
          helper = """function contextRows(sheet, context) {\n  const { index, row: headers } = findHeader(sheet.rows)\n  const rows = sheet.rows.slice(index + 1).filter(r => r.some(v => clean(v)))\n  if (context === 'kendaraan') return rows.filter(r => valueOf(r, headers, 'nomor_polisi'))\n  if (context === 'service') return rows.filter(r => valueOf(r, headers, 'nomor_polisi') && valueOf(r, headers, 'tanggal'))\n  if (context === 'dokumen') return rows.filter(r => valueOf(r, headers, 'nomor_polisi'))\n  if (context === 'pengajuan') return rows.filter(r => valueOf(r, headers, 'nomor_polisi') || valueOf(r, headers, 'keluhan'))\n  if (context === 'sewa') return rows.filter(r => valueOf(r, headers, 'nomor_kontrak') || valueOf(r, headers, 'nomor_polisi'))\n  return rows\n}\n\n"""
          if "function contextRows(sheet, context)" not in s:
              s = s.replace("async function importKendaraan(sheet) {", helper + "async function importKendaraan(sheet) {", 1)
          s = s.replace(
              "unit_kerja: valueOf(row, headers, 'unit_kerja') || null,\n      kilometer_terakhir:",
              "unit_kerja: valueOf(row, headers, 'unit_kerja') || null,\n      masa_berlaku_pajak: excelDate(valueOf(row, headers, 'masa_berlaku_pajak')),\n      kilometer_terakhir:",
              1,
          )
          p.write_text(s)

          # AppTransport: remove duplicated workbook fields in export and keep one copy.
          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text()
          duplicated = "['pemilik','Pemilik / PIC'],['driver','Driver'],['lokasi','Lokasi'],['unit_kerja','Unit Kerja'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak'],['catatan_hutang','Catatan Hutang'],['kilometer_terakhir','KM Terakhir']"
          # Normalize both the already-good and duplicated forms to one source-column sequence.
          while duplicated + ",['unit_kerja','Unit Kerja'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak'],['catatan_hutang','Catatan Hutang']" in s:
              s = s.replace(
                  duplicated + ",['unit_kerja','Unit Kerja'],['masa_berlaku_pajak','Masa Berlaku Pajak'],['status_pajak','Status Pajak'],['catatan_hutang','Catatan Hutang']",
                  duplicated,
                  1,
              )
          p.write_text(s)
          PY

      - name: Commit final patch to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/vehicle-fields-finalize.yml docs/.vehicle-import-pr-marker
          git add frontend/src/modules/DataPageTools.jsx frontend/src/AppTransport.jsx .github/workflows/vehicle-fields-finalize.yml docs/.vehicle-import-pr-marker
          git commit -m "fix: finalize vehicle workbook field mapping" || exit 0
          git push origin HEAD:${GITHUB_HEAD_REF}
