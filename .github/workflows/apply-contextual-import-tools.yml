name: Apply contextual import tools
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'muhammadsuryahar-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/modules/DataPageTools.jsx')
          s = p.read_text()
          s = s.replace("async function importPengajuan(sheet, profile) {\n  const { index, row: headers }, rows = { index: findHeader(sheet.rows).index, row: findHeader(sheet.rows).row }\n  const dataRows = sheet.rows.slice(index + 1).filter(r => r.some(v => clean(v)))", "async function importPengajuan(sheet, profile) {\n  const { index, row: headers } = findHeader(sheet.rows)\n  const dataRows = sheet.rows.slice(index + 1).filter(r => r.some(v => clean(v)))")
          start = s.find('function classify(')
          if start >= 0:
              end = s.find('\n\nasync function importKendaraan', start)
              s = s[:start] + s[end+2:]
          p.write_text(s)

          p = Path('frontend/src/AppTransport.jsx')
          s = p.read_text()
          s = s.replace("import ImportExcelPage from './modules/ImportExcelPage'\n", "import DataPageTools from './modules/DataPageTools'\n")
          s = s.replace("  ADMIN: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan', 'pengguna', 'import'],", "  ADMIN: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan', 'pengguna'],")
          s = s.replace("  TRANSPORT: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan', 'import'],", "  TRANSPORT: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan'],")
          s = s.replace("  { id: 'import', label: 'Import Excel', icon: 'document' },\n", "")
          s = s.replace("const pageContent = { dashboard: <DashboardFeaturePage profile={profile} onNavigate={setActivePage}/>, kendaraan: <KendaraanPage profile={profile}/>, pengajuan: <PermintaanServicePage profile={profile}/>, service: <ServicePage profile={profile}/>, sewa: <RentalPage profile={profile}/>, dokumen: <DocumentsPage profile={profile}/>, laporan: <ReportsPage />, pengguna: <UsersPage />, import: <ImportExcelPage profile={profile}/> }", "const pageContent = { dashboard: <DashboardFeaturePage profile={profile} onNavigate={setActivePage}/>, kendaraan: <KendaraanPage profile={profile}/>, pengajuan: <PermintaanServicePage profile={profile}/>, service: <ServicePage profile={profile}/>, sewa: <RentalPage profile={profile}/>, dokumen: <DocumentsPage profile={profile}/>, laporan: <ReportsPage />, pengguna: <UsersPage /> }")
          s = s.replace("<div className=\"content-container\">{pageContent[activePage] || pageContent.dashboard}</div>", "<div className=\"content-container\"><DataPageTools context={activePage} profile={profile} onExport={exportCurrentPage}/>{pageContent[activePage] || pageContent.dashboard}</div>")
          old = "{canExportCurrentPage && <button className=\"topbar-export\" onClick={exportCurrentPage} disabled={exportingPage} title={`Export ${NAV_ITEMS.find((item) => item.id === activePage)?.label || 'data'} ke Excel`}><span className=\"export-icon\">⇩</span><span className=\"export-label\">Export Excel</span></button>}"
          s = s.replace(old, "")
          p.write_text(s)
          PY
      - name: Remove workflow
        run: |
          rm -f .github/workflows/apply-contextual-import-tools.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/AppTransport.jsx frontend/src/modules/DataPageTools.jsx .github/workflows/apply-contextual-import-tools.yml
          git commit -m "feat: place Excel import and export inside data pages" || exit 0
          git push origin main