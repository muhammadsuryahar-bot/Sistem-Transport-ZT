name: Patch import and service wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app wiring and service structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/AppTransport.jsx')
          text = p.read_text(encoding='utf-8')
          if "import ImportExcelPage from './modules/ImportExcelPage'" not in text:
              text = text.replace("import { ServicePage, RentalPage, DocumentsPage, ReportsPage, UsersPage } from './modules/TransportOperationsPage'", "import { ServicePage, RentalPage, DocumentsPage, ReportsPage, UsersPage } from './modules/TransportOperationsPage'\nimport ImportExcelPage from './modules/ImportExcelPage'")
          text = text.replace("ADMIN: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan', 'pengguna']", "ADMIN: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan', 'pengguna', 'import']")
          text = text.replace("TRANSPORT: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan']", "TRANSPORT: ['dashboard', 'kendaraan', 'pengajuan', 'service', 'sewa', 'dokumen', 'laporan', 'import']")
          text = text.replace("{ id: 'pengguna', label: 'Pengguna', icon: 'user' },", "{ id: 'pengguna', label: 'Pengguna', icon: 'user' },\n  { id: 'import', label: 'Import Excel', icon: 'document' },")
          old = "laporan: <ReportsPage />, pengguna: <UsersPage /> }"
          new = "laporan: <ReportsPage />, pengguna: <UsersPage />, import: <ImportExcelPage profile={profile}/> }"
          if old in text:
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          p = Path('frontend/src/modules/ServiceFeaturePage.jsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace("const emptyService = { permintaan_service_id: '', kendaraan_id: '', tanggal_service: new Date().toISOString().slice(0, 10), kilometer: '', bengkel: '', jenis_service: 'SERVICE', keluhan: '', estimasi_biaya: '', biaya_aktual: '', catatan: '' }", "const emptyService = { permintaan_service_id: '', kendaraan_id: '', tanggal_service: new Date().toISOString().slice(0, 10), kilometer: '', bengkel: '', jenis_service: 'SERVICE', keluhan: '', estimasi_biaya: '', biaya_aktual: '', nilai_dpp: '', ppn: '', total: '', catatan: '' }")
          text = text.replace("const emptyItem = { service_id: '', nama_item: '', kategori: '', jumlah: '1', satuan: 'pcs', harga_satuan: '', keterangan: '' }", "const emptyItem = { service_id: '', nama_item: '', kategori: 'MATERIAL_SPAREPART', jumlah: '1', satuan: 'pcs', harga_satuan: '', keterangan: '' }")
          old = "catatan: form.catatan.trim() || null }).select('*').single()"
          new = "nilai_dpp: Number(form.nilai_dpp || estimate), ppn: Number(form.ppn || 0), total: Number(form.total || (Number(form.nilai_dpp || estimate) + Number(form.ppn || 0))), catatan: form.catatan.trim() || null }).select('*').single()"
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace("if (actual !== null && (!Number.isFinite(actual) || actual < 0)) throw new Error('Biaya aktual tidak valid.');", "if (actual !== null && (!Number.isFinite(actual) || actual < 0)) throw new Error('Biaya aktual tidak valid.'); const dpp = Number(form.nilai_dpp || estimate); const ppn = Number(form.ppn || 0); const total = Number(form.total || (dpp + ppn)); if (![dpp, ppn, total].every(Number.isFinite) || dpp < 0 || ppn < 0 || total < 0) throw new Error('DPP/PPN/Total tidak valid.');")
          old = "<input value={itemForm.kategori} onChange={(e)=>setItemForm({...itemForm,kategori:e.target.value})}"
          if old in text:
              text = text.replace(old, "<select value={itemForm.kategori} onChange={(e)=>setItemForm({...itemForm,kategori:e.target.value})}><option value=\"JASA_SERVICE\">Jasa Service</option><option value=\"MATERIAL_SPAREPART\">Material / Sparepart</option><option value=\"PENGADAAN_BARANG\">Pengadaan Barang</option><option value=\"BAN\">Ban</option><option value=\"AKI_BATERAI\">Aki / Baterai</option><option value=\"LAINNYA\">Lainnya</option></select>")
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/patch-import-and-service.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/AppTransport.jsx frontend/src/modules/ServiceFeaturePage.jsx .github/workflows/patch-import-and-service.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Wire Excel import and service financial breakdown'
          git push origin main
